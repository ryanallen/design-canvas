<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="canvas-fluid">
<title>Tidewater: pricing</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #14202b; background: #0f1b24; }
  .wrap { padding: 72px 6vw; }
  h2 { color: #fff; font-size: 40px; margin: 0 0 32px; }
  .plans { display: flex; flex-wrap: wrap; gap: 20px; }
  .plan { flex: 1 1 260px; background: #fff; border-radius: 18px; padding: 28px; }
  .plan b { display: block; font-size: 32px; margin: 8px 0 16px; }
  .plan ul { margin: 0; padding-left: 18px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Pick a plan</h2>
  <div class="plans">
    <div class="plan"><span>Free</span><b>$0</b><ul><li>One spot</li><li>Today only</li></ul></div>
    <div class="plan"><span>Local</span><b>$4</b><ul><li>Five spots</li><li>The week ahead</li></ul></div>
    <div class="plan"><span>Travel</span><b>$9</b><ul><li>Every spot</li><li>Alerts</li></ul></div>
  </div>
</div>
</body>
</html>
