  // ── locks ──
  // A locked frame or board object is not moved, changed or removed by anyone until it is
  // unlocked, and a visitor puts nothing new over it. Only the owner locks and unlocks: whoever
  // edits the canvas where it lives (served by node, or its folder on disk), never a visitor to a
  // published copy.
  const LOCKED = 'That is locked'
  const isLocked = (key) => !!key && (board.locked ?? []).includes(key)
  const owner = () => serve && !visitor
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h
  /** The locked frames and objects on this page a box would sit over, leaving out `self`. */
  function coversLocked(box, self) {
    const lockedFrames = frames().filter((f) => f.key !== self && isLocked(f.key)).map((f) => ({ x: f.x, y: f.y, w: f.W, h: f.H }))
    const lockedItems = items().filter((i) => i.id !== self && isLocked(i.id) && !['line', 'arrow', 'guide'].includes(i.kind)).map(geometryOf)

  /** Why a board change may not be made, or null. */
  function lockedReason(input) {
    if (input.op === 'lock') return owner() ? null : 'Only the owner locks and unlocks'
    if ((input.op === 'item' || input.op === 'remove') && isLocked(input.id)) return LOCKED
    if (input.op === 'move' && isLocked(input.key)) return LOCKED
    if (owner()) return null
    if (input.op === 'page' && input.removed) {
      const held = [...allFrames.values()].some((f) => f.page === input.id && isLocked(f.key)) || board.items.some((i) => (i.page ?? firstPage()) === input.id && isLocked(i.id))

    }
    let box = null
    if (input.op === 'move') {
      const f = allFrames.get(input.key)
      if (f) box = { x: input.x, y: input.y, w: f.W, h: f.H }
    } else if (input.op === 'item') {
      const it = { ...(board.items.find((i) => i.id === input.id) ?? {}), ...input }

  async function sendBoard(input) {
    if (!serve) throw new Error(readOnly)
    const refused = lockedReason(input)
    if (refused) throw new Error(refused)
    // What the line changes, as the lines said before it: the board as drawn may already show the change.
    const was = replaying ? null : stateOf(foldBoard(boardEvents), input)
    pending++
    try {
      const res = await fetch('/api/board', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ event: { name: me || 'someone', ...input } }) })

      if (was) remember(was, stateOf(board, body.event))
      return body.event
    } finally {
      pending--
    }
  }

  /** Every artboard on the page is loaded, so all of its text can be searched. */
  async function loadPage() {
    for (const f of frames()) if (!f.loaded && f.el) { f.loaded = true; loadFrame(f) }

  }
  async function runFind() {
    const q = findIn.value.trim().toLowerCase()
    found = []
    foundAt = -1
    if (q) {
      await loadPage()
      for (const f of frames()) {
        if (!f.doc?.body) continue
        const walk = f.doc.createTreeWalker(f.doc.body, NodeFilter.SHOW_TEXT, { acceptNode: (t) => (t.parentElement?.closest('script, style, template, noscript') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) })
        for (let t = walk.nextNode(); t; t = walk.nextNode()) {
          const n = t.data.toLowerCase().split(q).length - 1
          const el = call('climb', t.parentElement) ?? t.parentElement
          for (let i = 0; i < n; i++) found.push({ frame: f, el })
        }
      }
      for (const it of items()) {
        const n = String(it.text ?? '').toLowerCase().split(q).length - 1
        for (let i = 0; i < n; i++) found.push({ item: it.id })

  async function replaceAll() {

        if (!it || isLocked(id)) continue
        const text = String(it.text ?? '').replace(re, () => (n++, put))

    clearTimeout(findTimer)
    findTimer = setTimeout(runFind, 150)
  })
  for (const input of [findIn, replaceIn]) {
    input.addEventListener('keydown', (e) => {
      e.stopPropagation()
      if (e.key === 'Escape') closeFind()
      else if (e.key === 'Enter' && input === findIn) stepFound(e.shiftKey ? -1 : 1)
      else if (e.key === 'Enter') replaceAll()
    })
  }
  function openFind() {
    findBar.classList.add('open')
    replaceIn.parentElement && (replaceIn.disabled = !serve)
    findIn.focus()
    findIn.select()
    if (findIn.value) runFind()
  }
  function closeFind() {
    findBar.classList.remove('open')
    found = []
  }

  // ── undo and redo for the board ──
  // One history with the prototypes' edits, as in Figma: Ctrl+Z undoes whatever was done last.
  // A step is everything one action sent (a group dragged, an align, a paste): each board object
  // and frame it touched, as it was before and after. A file edit is a 'file' entry, undone by the server.
  const history = []
  const future = []
  let openStep = null
  let replaying = false
  const ITEM_KEYS = ['kind', 'page', 'x', 'y', 'w', 'h', 'z', 'text', 'color', 'frame', 'from', 'to', 'group', 'cols', 'gutter', 'margin', 'points', 'size']
  /** The one thing a line touches, as a board says it is: an object's fields, a frame's place, or null for nothing there. */
  function stateOf(b, ev) {
    if (ev.op === 'item' || ev.op === 'remove') {
      if (!ev.id) return { id: null, state: null }
      const it = b.items.find((i) => i.id === ev.id)
      return { id: ev.id, state: it ? Object.fromEntries(ITEM_KEYS.filter((k) => it[k] != null).map((k) => [k, it[k]])) : null }
    }
    if (ev.op === 'move') {
      const f = allFrames.get(ev.key)
      const m = b.moved[ev.key] ?? f?.home
      return { key: ev.key, state: m ? { x: m.x, y: m.y, page: m.page ?? f?.page ?? null } : null }
    }
    // A page: its name and whether it is removed; a new page's id is known from its line.
    if (ev.op === 'page') {
      // A page the layout made has no line until it is first changed: its name is the layout's.
      const own = ev.id ? b.pages.find((x) => x.id === ev.id) : null
      const laid = ev.id ? data.pages.find((x) => x.id === ev.id) : null
      const at = ev.order != null ? pages().findIndex((x) => x.id === ev.id) : -1
      const p = own || laid ? { title: own?.title || laid?.title, removed: !!own?.removed, ...(ev.order != null ? { order: own?.order ?? at } : {}) } : null
      return { kind: 'page', id: ev.id ?? null, state: p }
    }
    if (ev.op === 'lock') return { kind: 'lock', key: ev.key, state: b.locked.includes(ev.key) }
    if (ev.op === 'name') return { kind: 'name', key: 'canvas', state: b.name || data.title }
    return null
  }
  function remember(before, after) {
    // A new object's id is only known from its line.
    if (before.id === null) before.id = after.id
    if (!openStep) {
      openStep = { kind: 'board', changes: new Map() }
      history.push(openStep)
      future.length = 0
      if (history.length > 200) history.shift()
      const step = openStep
      // The step closes once its action has sent everything: each send starts as the last one ends, before any timer.
      const close = () => (pending ? setTimeout(close, 0) : openStep === step && (openStep = null))
      setTimeout(close, 0)
    }
    const k = before.kind ? `${before.kind}:${before.id ?? before.key}` : before.id ?? `frame:${before.key}`
    const c = openStep.changes.get(k)
    if (c) c.after = after.state
    else openStep.changes.set(k, { kind: before.kind, id: before.id, key: before.key, before: before.state, after: after.state })
  }
  let pending = 0
  /** Put every object and frame of a step back as it was (or forward as it became). */
  async function replay(step, back) {
    replaying = true
    try {
      for (const c of [...step.changes.values()].reverse()) {
        const want = back ? c.before : c.after
        const other = back ? c.after : c.before
        if (c.kind === 'page') {
          await sendBoard(want ? { op: 'page', id: c.id, title: want.title, removed: want.removed, ...(want.order != null ? { order: want.order } : {}) } : { op: 'page', id: c.id, removed: true })
          continue
        }
        if (c.kind === 'name') {
          await sendBoard({ op: 'name', title: want })
          setTitle(want)
          continue
        }
        if (c.kind === 'lock') {
          await sendBoard({ op: 'lock', key: c.key, locked: want })
          continue
        }
        if (c.key) {
          if (want) await sendBoard({ op: 'move', key: c.key, x: want.x, y: want.y, ...(want.page ? { page: want.page } : {}) })
          continue
        }
        if (!want) {
          if (board.items.some((i) => i.id === c.id)) await sendBoard({ op: 'remove', id: c.id })
          continue
        }
        // A field the other side had and this one lacks is cleared.
        const clear = Object.fromEntries(Object.keys(other ?? {}).filter((k) => want[k] == null).map((k) => [k, ['x', 'y', 'w', 'h', 'z'].includes(k) ? 0 : k === 'points' ? [] : '']))
        await sendBoard({ op: 'item', id: c.id, ...clear, ...want })
      }
    } finally {
      replaying = false
      relayout()
      // A page put back or taken away: the switcher and, if it was this page, the page shown.
      if (!pages().some((p) => p.id === pageId)) goPage(firstPage())

      pickItem(null)
      renderItems()
    }
  }
  /** Ctrl+Z or Ctrl+Shift+Z: true when the last thing done was on the board and it was undone here. */
  async function boardUndo(redo) {
    const from = redo ? future : history
    const to = redo ? history : future
    const top = from[from.length - 1]
    if (!top) return false
    from.pop()
    to.push(top)
    if (top === openStep) openStep = null
    if (top.kind === 'file') return false
    try {
      await replay(top, !redo)
      hint(redo ? 'Redone' : 'Undone', 900)
    } catch (err) {
      hint(err.message, 3000)
      takeBoardAgain()
    }
    return true
  }
  /** A prototype edit was made: it takes its place in the one history. */
  const noteFileEdit = () => {
    openStep = null
    history.push({ kind: 'file' })
    future.length = 0
  }

  // ── comments ──
  // Where comments go: served by node, the server; otherwise the address the canvas was built with
  // (`comments` in canvas.json, or --comments), or the hosting site's own endpoint, as team docs has.
  // Editing from disk switches it to the page's own answers (local.js).
  let api = serve ? '/api/canvas-comments' : data.comments || (web ? '/api/canvas-comments' : null)
  const crossSite = () => /^https?:/.test(api) && new URL(api).origin !== location.origin
  const withCredentials = () => (crossSite() ? { credentials: 'include', mode: 'cors' } : {})
  const readOnly = 'Opened from disk, so it only shows until editing is on. Click Edit here (Chrome or Edge) and allow the folder it is in.'
  let events = []
  let threads = []
  let commentDraft = null
  let draft = null
  let activeId = null
  let me = store.get('name') || ''
  let viewer = null
  const showResolved = () => $('#show-resolved').checked

  /** Where a thread's pin is on the board: on its element when the editor can find it, else where it was left. */
  const anchorOf = (t) => {
    const f = t.frame ? findFrame(t.frame) : null
    if (t.anchor && f && f.page === pageId) {
      const at = call('anchorPoint', t, f)
      if (at) return { x: at.x, y: at.y, top: at.top, bottom: at.bottom, frame: f, page: f.page }
      return { x: f.x + t.x * (f.s ?? 1), y: f.y + t.y * (f.s ?? 1), frame: f, page: f.page, detached: !!f.doc }
    }
    if (f) return { x: f.x + t.x * (f.s ?? 1), y: f.y + t.y * (f.s ?? 1), frame: f, page: f.page }
    // On a board object: where the object is now, at the same offset; else where it was left, on its own page.
    const on = t.item ? board.items.find((i) => i.id === t.item) : null
    if (on) return { x: on.x + (t.dx ?? 0), y: on.y + (t.dy ?? 0), frame: null, page: on.page ?? firstPage() }
    return { x: t.x, y: t.y, frame: null, page: t.page ?? firstPage() }
  }
  const number = (t) => threads.indexOf(t) + 1 || '…'
  const when = (iso) => {
    const d = new Date(iso)
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
  }

  function renderPins() {
    drawFlows()
    itemPins = threads.some((t) => t.item)
    pinLayer.replaceChildren()
    for (const t of threads) {
      const p = anchorOf(t)
      if (p.page !== pageId) continue
      pinLayer.append(h('button', {
        type: 'button',
        class: `pin${t.resolved ? ' resolved' : ''}${t.agent ? ' agent' : ''}${t.id === activeId ? ' active' : ''}${p.detached ? ' detached' : ''}`,
        style: `left:${p.x}px;top:${p.y}px`,
        title: `${t.name}: ${t.text}${p.detached ? ' (its element is gone; pinned where it was left)' : ''}`,
        onclick: (e) => { e.stopPropagation(); openThread(t.id) },
      }, String(number(t))))
    }
    if (draft) pinLayer.append(h('div', { class: 'pin active', style: `left:${draft.wx}px;top:${draft.wy}px` }, '+'))
    const open = threads.filter((t) => !t.resolved).length
    $('#comment-count').textContent = String(open)
    $('#comment-count').hidden = !open

  }
  function renderList() {
    const list = $('#comment-list')
    document.body.classList.toggle('hide-resolved', !showResolved())
    const shown = threads.filter((t) => showResolved() || !t.resolved)
    list.replaceChildren(...(shown.length
      ? shown.map((t) => {
          const f = t.frame ? findFrame(t.frame) : null
          return h('button', { type: 'button', class: `citem${t.resolved ? ' resolved' : ''}${t.agent ? ' agent' : ''}${t.id === activeId ? ' active' : ''}`, onclick: () => openThread(t.id, true) },
            h('div', { class: 'meta' }, h('span', { class: 'num' }, String(number(t))), h('b', {}, t.name), h('span', {}, when(t.at)), t.agent ? h('span', {}, '· for the agent') : null, t.replies.length ? h('span', {}, `· ${t.replies.length} repl${t.replies.length === 1 ? 'y' : 'ies'}`) : null, t.resolved ? h('span', {}, '· resolved') : null),
            h('div', { class: 'body' }, t.text),
            h('div', { class: 'where' }, f ? `${pages().find((p) => p.id === f.page)?.title ?? ''} · ${f.label}` : 'On the board'))
        })
      : [h('div', { class: 'empty' }, api ? 'No comments yet. Press C, then click anywhere.' : 'No comments.')]))
  }

  function startComment(sx, sy, agent = false) {
    if (!api) return hint(readOnly, 3000)
    const p = toWorld(sx, sy)
    const f = frameAt(sx, sy)
    const pin = f ? call('commentAnchor', f, p) : null
    // Dropped on a board object (a note, a shape, a section): the pin goes with it when it moves.
    const on = f ? null : board.items.find((i) => i.id === document.elementFromPoint(sx, sy)?.closest('.item')?.dataset.id && i.kind !== 'line' && i.kind !== 'arrow' && i.kind !== 'pencil')
    draft = { wx: p.x, wy: p.y, frame: f ? f.key : null, x: f ? Math.round((p.x - f.x) / f.s) : p.x, y: f ? Math.round((p.y - f.y) / f.s) : p.y, page: pageId, agent, ...(on ? { item: on.id, dx: Math.round(p.x - on.x), dy: Math.round(p.y - on.y) } : {}), ...(pin ?? {}) }
    activeId = null
    renderPins()
    showThread({ draft })
  }
  /** A comment on whatever the editor has selected: pinned to it, at its top-left corner. */
  function commentOn(target, agent = false) {
    if (!api) return hint(readOnly, 3000)
    const f = target.frame
    draft = { wx: target.wx, wy: target.wy, frame: f.key, x: Math.round((target.wx - f.x) / f.s), y: Math.round((target.wy - f.y) / f.s), page: f.page, agent, file: target.file, anchor: target.anchor }
    activeId = null
    renderPins()
    showThread({ draft })
  }

  async function send(input) {
    const res = await fetch(api, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ path: location.pathname, event: input }), ...withCredentials() })
    const body = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(body.error || `Saving failed (${res.status})`)
    events.push(body.event)
    threads = foldEvents(events)
    return body.event
  }
  async function refresh() {
    if (!api) return
    try {
      const res = await fetch(`${api}${api.includes('?') ? '&' : '?'}path=${encodeURIComponent(location.pathname)}`, { cache: 'no-store', ...withCredentials() })
      if (!res.ok) return
      const body = await res.json()
      viewer = body.viewer ?? null
      if (!me && viewer?.name) setName(viewer.name)
      // Only when something changed: redrawing an open thread on every poll would take the focus
      // and the caret out of a reply being typed.
      if (Array.isArray(body.events) && body.events.length >= events.length && JSON.stringify(body.events) !== JSON.stringify(events)) {
        events = body.events
        threads = foldEvents(events)
        renderPins()

          if (threads.some((t) => t.id === activeId)) showThread({ id: activeId }, true)
          else closeThread()
        }
      }
    } catch {}
  }
  function setName(name) {
    me = name.trim().slice(0, LIMITS.name)

  }

  // ── the thread popover ──
  const thread = $('#thread')
  let threadAt = null

    draft = null
    activeId = id
    const t = threads.find((x) => x.id === id)
    if (!t) return
    const p0 = anchorOf(t)
    if (p0.page !== pageId) goPage(p0.page)
    if (fly) {
      const p = anchorOf(t)
      const z = Math.max(view.z, 0.35)
      view.z = z
      view.x = (viewport.clientWidth - panelWidth()) / 2 - p.x * z
      view.y = viewport.clientHeight / 2 - p.y * z

    }

    showThread({ id })
  }

  }
  function showThread(what, keepTyping = false) {

    const typed = keepTyping ? thread.querySelector('textarea')?.value : ''
    const t = what.id ? threads.find((x) => x.id === what.id) : null
    const msgs = h('div', { class: 'msgs' })
    const error = h('div', { class: 'error' })
    const textarea = h('textarea', { placeholder: t ? 'Reply' : 'Leave a comment', maxlength: LIMITS.text, rows: '3' })
    if (typed) textarea.value = typed
    const nameIn = h('input', { class: 'name-in', placeholder: 'Your name', maxlength: LIMITS.name, value: me, 'aria-label': 'Your name' })
    const forAgent = h('input', { type: 'checkbox' })

      submit.disabled = true
      error.textContent = ''

        } else {
          const d = what.draft

          activeId = ev.id

        }
      } catch (err) {
        error.textContent = err.message

      }
    } },
      me ? null : nameIn,
      textarea,
      error,
      h('div', { class: 'row' }, t ? h('span', {}, me ? `as ${me}` : '') : h('label', { title: 'Mark it as work for an agent' }, forAgent, 'For the agent'), h('button', { type: 'button', class: 'btn quiet', onclick: closeThread }, 'Cancel'), submit),

            } }, 'Delete') : null),

          m.root && t.file ? h('div', { class: 'on' }, `On ${t.file}${t.anchor ? ` · ${t.anchor.text ? `“${t.anchor.text.length > 40 ? `${t.anchor.text.slice(0, 40)}…` : t.anchor.text}”` : t.anchor.path}` : ''}`) : null))
      }
    }

      h('b', {}, t ? `#${number(t)}${t.resolved ? ' · resolved' : ''}` : 'New comment'),

        try {

          showThread({ id: t.id })
        } catch (err) { error.textContent = err.message }

      t && api ? h('button', { type: 'button', class: 'tool', title: t.resolved ? 'Reopen' : 'Resolve', onclick: async () => {

  }
  function placeThread() {
    if (!threadAt || !thread.classList.contains('open')) return
    const p = threadAt.thread ? anchorOf(threadAt.thread) : { x: threadAt.draft.wx, y: threadAt.draft.wy }
    const s = toScreen(p.x, p.y)
    const w = thread.offsetWidth || 300
    // On a line short enough on screen, the thread opens under it (or over it), so what it is about stays in sight.
    const line = p.bottom != null ? { top: toScreen(p.x, p.top).y, bottom: toScreen(p.x, p.bottom).y } : null
    const onLine = line && line.bottom - line.top <= 160 && innerWidth > 640
    let left = onLine ? Math.min(s.x - 24, innerWidth - w - 12) : s.x + 24
    if (!onLine && left + w > innerWidth - 12) left = s.x - w - 12
    left = Math.max(12, left)
    // It ends above the toolbar when it would cross it, shortening (its messages scroll) on a short window.
    // A phone's sheet is placed by the stylesheet.
    let floor = innerHeight - 12
    if (innerWidth > 640) {
      const tb = $('#toolbar').getBoundingClientRect()
      if (tb.height && left < tb.right && left + w > tb.left) floor = tb.top - 8
      thread.style.maxHeight = `${Math.max(180, Math.min(460, floor - 56))}px`
    } else thread.style.maxHeight = ''
    const hgt = thread.offsetHeight || 200
    let top = Math.max(56, Math.min(Math.max(56, s.y - 30), floor - hgt))
    if (onLine && line.bottom + 10 + hgt <= floor) top = line.bottom + 10
    else if (onLine && line.top - 10 - hgt >= 56) top = line.top - 10 - hgt
    else if (onLine) {
      left = s.x + 24 + w > innerWidth - 12 ? Math.max(12, s.x - w - 12) : s.x + 24
    }
    thread.style.left = `${left}px`
    thread.style.top = `${top}px`
  }

  // ── Ask agent ──
  const ask = $('#ask')
  let askTarget = null
  let askRegion = null
  function openAsk() {
    if (!api) return hint(readOnly, 3000)
    if (thread.classList.contains('open')) closeThread()
    askRegion = chosen ? { box: { ...chosen.box }, items: [...chosen.items, ...chosen.frames] } : null
    askTarget = askRegion ? null : call('selectionTarget') ?? null
    const n = askRegion?.items.length
    $('#ask-on').textContent = askRegion ? `On the ${n} thing${n === 1 ? '' : 's'} in the box` : askTarget ? `On ${askTarget.label}` : 'On the board, where the view is centred'

    $('#tool-ask').setAttribute('aria-pressed', 'true')
    $('#ask-error').textContent = ''

  }

  }
  $('#tool-ask').addEventListener('click', () => (ask.classList.contains('open') ? closeAsk() : openAsk()))

  $('#ask-text').addEventListener('keydown', (e) => {

    if (e.key === 'Enter' && !e.shiftKey) {

    }
  })
  ask.addEventListener('submit', async (e) => {
    e.preventDefault()
    const text = $('#ask-text').value.trim()
    if (!text) return
    const name = me || (await question('Your name, to sign the request:')) || ''
    if (!name.trim()) return
    setName(name)
    let at
    if (askRegion) {
      const b = askRegion.box
      at = { frame: null, x: b.x + b.w, y: b.y, box: b, items: askRegion.items }

    const l = local(f, p)
    return climb(f.doc.elementFromPoint(l.x, l.y))
  }

  const ACTIVE = 'a[href], button, input, select, textarea, label, summary'
  const actionAt = (f, p) => {
    if (!f?.doc) return null
    const l = local(f, p)
    return f.doc.elementFromPoint(l.x, l.y)?.closest?.(ACTIVE) ?? null
  }
  function workIt(f, el) {
    if (el.localName === 'a') {
      const href = el.getAttribute('href') ?? ''
      if (href.startsWith('#')) return el.click()
      const to = /^([^:?#]+\.html)(#.*)?$/i.exec(href)
      if (to) {
        const file = to[1].replace(/^\.\//, '')
        const hash = (to[2] ?? '').slice(1)
        const all = dc.allFrames
        const frame = all.find((x) => x.file === file && (x.hash || '') === hash) ?? all.find((x) => x.file === file)
        return frame ? dc.showFrame(frame) : hint(`${file} is not on this canvas`, 2500)
      }
      if (/^(https?:|mailto:|tel:)/i.test(href)) return window.open(el.href, '_blank', 'noopener')
      return hint(`${href} goes nowhere from a canvas`, 2500)
    }
    if (/^(input|select|textarea)$/.test(el.localName) && !/^(checkbox|radio|button|submit|reset)$/i.test(el.type)) return el.focus()
    el.click()
  }

  // ── drawing the selection on the board ──
  const rectOn = (f, el) => {
    const r = boxOf(el)
    const a = dc.toScreen(f.x + r.left * f.s, f.y + r.top * f.s)
    const k = f.s * dc.view.z
    return { x: a.x, y: a.y, w: r.width * k, h: r.height * k, r }
  }
  let dropLine = null
  let dragGhost = null
  function draw() {
    overlay.replaceChildren()
    if (hover && (!sel || !sel.els.includes(hover.el)) && live(hover.el)) {
      const b = rectOn(hover.frame, hover.el)
      overlay.append(h('div', { class: 'ov hover', style: box(b) }))
    }
    if (sel && sel.frame.doc) {
      sel.els = sel.els.filter(live)
      sel.els.forEach((el, i) => {
        const b = rectOn(sel.frame, el)
        const one = h('div', { class: `ov sel${i ? ' copy' : ''}`, style: box(b) })
        if (i === 0) {
          const n = nameOf(el)
          one.append(h('div', { class: 'ov-tag' }, `${n.text}${sel.els.length > 1 ? ` · ${sel.els.length} ${everyCopy() ? 'copies' : 'selected'}` : ''}`, h('span', {}, `${Math.round(b.r.width)} × ${Math.round(b.r.height)}`)))
          if (sel.els.length === 1 && editable(el) && !editing) {
            for (const hd of ['nw', 'ne', 'sw', 'se', 'e', 's']) one.append(h('div', { class: `handle ${hd}`, 'data-h': hd, onpointerdown: (e) => startResize(e, hd) }))
          }
        }
        overlay.append(one)
      })
    }
    if (dragGhost) overlay.append(h('div', { class: 'ov ghost', style: box(dragGhost) }, h('span', {}, dragGhost.name)))
    if (dropLine) overlay.append(h('div', { class: 'ov drop', style: box(dropLine) }))
    if (measuring && sel?.els.length === 1 && hover && hover.frame === sel.frame && hover.el !== primary() && live(hover.el)) measure(sel.frame, primary(), hover.el)
  }
  // ── measure: Alt held over another element shows how far it is from the selection, in the prototype's own pixels ──
  let measuring = false
  function measure(f, a, b) {
    const A = boxOf(a)
    const B = boxOf(b)
    const at = (x, y) => dc.toScreen(f.x + x * f.s, f.y + y * f.s)
    const lines = []
    /** A line across (y fixed) or down (x fixed) from p to q, labelled with its length. */
    const line = (horiz, fixed, p, q) => {
      if (Math.round(Math.abs(q - p)) < 1) return
      const [s, e] = [Math.min(p, q), Math.max(p, q)]
      const a1 = horiz ? at(s, fixed) : at(fixed, s)
      const a2 = horiz ? at(e, fixed) : at(fixed, e)
      lines.push(h('div', { class: `ov measure ${horiz ? 'h' : 'v'}`, style: horiz ? `left:${a1.x}px;top:${a1.y}px;width:${a2.x - a1.x}px` : `left:${a1.x}px;top:${a1.y}px;height:${a2.y - a1.y}px` },
        h('span', { class: 'measure-n' }, String(Math.round(e - s)))))
    }
    const inside = (o, i) => i.left >= o.left && i.right <= o.right && i.top >= o.top && i.bottom <= o.bottom
    if (inside(B, A) || inside(A, B)) {
      // One holds the other: its distance to each of the outer one's sides.
      const [i, o] = inside(B, A) ? [A, B] : [B, A]
      const my = (i.top + i.bottom) / 2
      const mx = (i.left + i.right) / 2
      line(true, my, o.left, i.left)
      line(true, my, i.right, o.right)
      line(false, mx, o.top, i.top)
      line(false, mx, i.bottom, o.bottom)
    } else {
      // Apart: the gap across and the gap down, drawn where they face each other.
      const overlapY = [Math.max(A.top, B.top), Math.min(A.bottom, B.bottom)]
      const overlapX = [Math.max(A.left, B.left), Math.min(A.right, B.right)]
      const y = overlapY[0] < overlapY[1] ? (overlapY[0] + overlapY[1]) / 2 : (A.top + A.bottom) / 2
      const x = overlapX[0] < overlapX[1] ? (overlapX[0] + overlapX[1]) / 2 : (A.left + A.right) / 2
      if (B.left >= A.right) line(true, y, A.right, B.left)
      else if (A.left >= B.right) line(true, y, B.right, A.left)
      if (B.top >= A.bottom) line(false, x, A.bottom, B.top)
      else if (A.top >= B.bottom) line(false, x, B.bottom, A.top)
    }
    const hb = rectOn(f, b)
    overlay.append(h('div', { class: 'ov measure-to', style: box(hb) }), ...lines)
  }
  const setMeasuring = (on) => {
    if (on === measuring) return
    measuring = on
    document.body.classList.toggle('measuring', on)
    draw()
  }
  addEventListener('keydown', (e) => e.key === 'Alt' && sel && setMeasuring(true))
  addEventListener('keyup', (e) => e.key === 'Alt' && setMeasuring(false))
  addEventListener('blur', () => setMeasuring(false))
  const box = (b) => `left:${b.x}px;top:${b.y}px;width:${Math.max(1, b.w)}px;height:${Math.max(1, b.h)}px`

  // ── the board's pointer, seen first here ──
  hooks.onPointerDown = (e, { frame, point, tool }) => {
    if (editing) {
      stopEditing(true)
      if (frame === editing?.frame) return true
    }
    if (!frame || !frame.doc) {
      if (tool === 'select' && frame) return true
      return false
    }
    if (tool === 'text') {
      if (!editable(frame.doc.body)) return true
      addText(frame, point)
      return true
    }
    if (tool !== 'select') return false
    // A plain click works the page: links go where they point, buttons, checkboxes and fields act.
    // Ctrl or ⌘ (or Shift, Alt) selects instead, to edit it.
    if (!(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey)) {
      const act = actionAt(frame, point)
      if (act) {
        workIt(frame, act)
        return true
      }
    }
    const deep = elementAt(frame, point)
    // Clicks pick the card: a press inside the block selected drags that block, as Figma drags a selected group from
    // any of its layers; only a click that does not move goes one level in.
    const cur = sel?.frame === frame && sel.els.length === 1 ? primary() : null
    if (dc.store?.get('clickDepth') === 'outer' && cur && deep && cur !== deep && cur.contains(deep) && !e.shiftKey && !e.altKey && editable(cur) && cur.localName !== 'body') {
      const next = byDepth(frame, deep)
      startMove(e, frame, point, () => pick(frame, next))
      return true

      next one in on the way to it. Otherwise the element under the pointer, as before. */
  function byDepth(frame, deep) {
    if (!deep || dc.store?.get('clickDepth') !== 'outer') return deep
    const body = frame.doc.body
    const chain = []
    for (let k = deep; k && k !== body && k.localName !== 'html'; k = k.parentElement) chain.unshift(k)
    if (!chain.length) return deep
    const cur = sel?.frame === frame ? primary() : null
    const i = cur ? chain.indexOf(cur) : -1
    if (i >= 0) return chain[Math.min(i + 1, chain.length - 1)]
    // From the top down, past any block nearly as big as the page itself (a <main> or a wrapper).
    const page = body.getBoundingClientRect()
    let j = 0
    while (j < chain.length - 1) {
      const r = chain[j].getBoundingClientRect()
      if (r.width * r.height < page.width * page.height * 0.6) break
      j++
    }
    return chain[j]
  }
  hooks.onHover = (e, info) => {
    document.body.classList.toggle('over-action', !!(e && info?.frame && dc.tool === 'select' && !editing && !(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) && actionAt(info.frame, info.point)))
    if (!e || !info?.frame || dc.tool !== 'select' || editing) {
      if (hover) {
        hover = null
        draw()
      }
      return
    }
    // Outlined is what a click would pick, whichever the click setting.
    const el = byDepth(info.frame, elementAt(info.frame, info.point))
    if (el !== hover?.el) {
      hover = el ? { frame: info.frame, el } : null
      draw()
      api.onHover(hover)
    }
  }
  hooks.climb = (el) => climb(el)
  hooks.onDblClick = (e, { frame, point }) => {
    if (!frame?.doc) return
    const el = elementAt(frame, point)
    if (!el) return
    if (isText(el)) startEditing(frame, el)
    else {
      // Double-click goes one level in, toward what was clicked.
      const deep = frame.doc.elementFromPoint(local(frame, point).x, local(frame, point).y)
      let k = deep
      while (k && k.parentElement !== el) k = k.parentElement
      if (k) pick(frame, k)
    }
  }
  hooks.onEmptyClick = () => select(null, [])
  hooks.onFramePick = (f) => {
    if (f.doc) pick(f, f.doc.body)
  }
  hooks.onItemPick = () => select(null, [], { quiet: true })
  hooks.onMarquee = () => select(null, [], { quiet: true, keep: true })
  hooks.onView = () => {
    draw()
    placeFloat()
  }
  hooks.onPage = () => {
    sel = null
    hover = null
    draw()
    renderFloat()
    api.onChange()
  }
  hooks.onTool = () => {
    hover = null
    draw()
  }
  hooks.onFrameLoad = (f) => {
    // The selection comes back by offset after the frame redraws.
    if (pendingSelect && pendingSelect.file === f.file && (pendingSelect.key ? pendingSelect.key === f.key : true)) {
      const el = pendingSelect.cv != null ? f.doc.querySelector(`[data-cv="${pendingSelect.cv}"]`) : null
      const keep = pendingSelect
      pendingSelect = null
      if (el) select(f, keep.copies ? copiesOf(el) : [el], { quiet: true })
      else select(null, [])
      if (keep.then) keep.then(f, el)
    } else if (sel && sel.frame === f) {
      select(null, [])
    }
    api.onFrameLoad(f)
    draw()
  }
  hooks.selectedFile = () => sel?.frame.file ?? null
  /** The box round the selected elements on the board, for zoom to selection. */
  hooks.selectionBox = () => {
    const els = sel?.els.filter(live) ?? []
    if (!els.length) return null
    const f = sel.frame
    const rs = els.map((el) => boxOf(el))
    const x = Math.min(...rs.map((r) => r.left))
    const y = Math.min(...rs.map((r) => r.top))
    return { x: f.x + x * f.s, y: f.y + y * f.s, w: (Math.max(...rs.map((r) => r.right)) - x) * f.s, h: (Math.max(...rs.map((r) => r.bottom)) - y) * f.s }
  }
  hooks.selectionTarget = () => {
    const el = primary()
    if (!el) return null
    const b = boxOf(el)
    const a = anchorFor(sel.frame, el, 0, 0)
    return { frame: sel.frame, file: sel.frame.file, anchor: a, wx: sel.frame.x + b.left * sel.frame.s, wy: sel.frame.y + b.top * sel.frame.s, label: `${nameOf(el).text} in ${sel.frame.file}` }
  }
  hooks.onOutsideChange = () => {}

  // ── comment anchors: a path from the nearest element with an id or a data-name ──
  function anchorFor(f, el, dx, dy) {
    const steps = []
    let k = el
    while (k && k.localName !== 'body' && !k.id && !k.getAttribute('data-name')) {
      const parent = k.parentElement
      if (!parent) break
      steps.unshift([...parent.children].indexOf(k))
      k = parent
    }
    const root = !k || k.localName === 'body' ? 'body' : k.id ? `#${k.id}` : `[data-name="${k.getAttribute('data-name').replace(/"/g, '\\"')}"]`
    return { path: [root, ...steps].join(' > '), dx: Math.round(dx), dy: Math.round(dy), tag: el.localName, text: said(el) }
  }
  /** The start of what an element says, as an anchor keeps it. */
  // What an element says, its pieces of text joined by spaces ("Fort Point 4.8 mi", not "Fort Point4.8 mi"), as an agent reads it.
  const said = (el) => excerpt(el, 80).replace(/…$/, '').slice(0, 80)
  // Pins made before joined the pieces with nothing between: they are still found by those words.
  const saidBefore = (el) => (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80)
  const says = (el, text) => said(el) === text || saidBefore(el) === text
  /** The element a comment is pinned to: by its path, checked against what it is and says; when
      something put before it has moved it, the element of that tag saying those words. */
  function resolveAnchor(doc, path, anchor = {}) {
    const byPath = followPath(doc, path)
    if (!anchor.text || (byPath && byPath.localName === anchor.tag && says(byPath, anchor.text))) return byPath
    const same = [...doc.querySelectorAll(anchor.tag || '*')].filter((el) => says(el, anchor.text))
    return same[0] ?? byPath
  }
  function followPath(doc, path) {
    const [root, ...steps] = path.split(' > ')
    let el
    try {
      el = root === 'body' ? doc.body : doc.querySelector(root)
    } catch {
      return null
    }
    for (const s of steps) {
      el = el?.children[Number(s)]
      if (!el) return null
    }
    return el
  }
  hooks.commentAnchor = (f, p) => {
    const el = elementAt(f, p)
    if (!el) return null
    const l = local(f, p)
    const r = boxOf(el)
    return { file: f.file, anchor: anchorFor(f, el, l.x - r.left, l.y - r.top) }
  }
  hooks.anchorPoint = (t, f) => {
    if (!f.doc || !t.anchor || (t.file && t.file !== f.file)) return null
    const el = resolveAnchor(f.doc, t.anchor.path, t.anchor)
    if (!el) return null
    const r = boxOf(el)
    return { x: f.x + (r.left + Math.min(t.anchor.dx, r.width)) * f.s, y: f.y + (r.top + Math.min(t.anchor.dy, r.height)) * f.s, top: f.y + r.top * f.s, bottom: f.y + r.bottom * f.s }
  }

  // ── writing ──
  let busy = false
  /** One edit to the selected frame's file. The answer redraws every frame of that file and the selection returns. */
  async function send(edit, { file = sel?.frame.file, key = sel?.frame.key, copies = false, then } = {}) {
    if (!dc.serve) return
    if (!file) return
    if (fileLocked(file)) return hint('This artboard is locked', 2000)
    if (busy) return hint('Still saving the last change', 1200)
    busy = true
    try {
      const res = await fetch('/api/edit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ file, edit, name: dc.me || 'someone' }) })
      const body = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(body.error || `Saving failed (${res.status})`)
      // Nothing to write (a sheet already linked): what was to follow the redraw follows now.
      if (body.same) {
        if (then) setTimeout(() => then(sel?.frame, sel ? primary() : null), 0)
        return
      }
      dc.noteFileEdit?.()
      if (body.linked) hint(`Made in all ${body.linked + 1} copies of the component${body.screens ? ` on ${body.screens + 1} screens` : ''}`, 1600)
      pendingSelect = { file, key, cv: body.select, copies, then }
      dc.reloadFile(file, body.html)
      // The component's copies on other screens took the change too.
      for (const [other, html] of Object.entries(body.others ?? {})) dc.reloadFile(other, html)
    } catch (err) {
      hint(err.message, 4000)
      // A refused edit may already show in the frame: draw the file as it is.
      try {
        const res = await fetch(`/api/file?f=${encodeURIComponent(file)}`, { cache: 'no-store' })
        if (res.ok) dc.reloadFile(file, (await res.json()).html)
      } catch {}
    } finally {
      busy = false
    }
  }
  /** One declaration of a rule in a stylesheet the prototypes link: written into that file, every frame linking it
   *  redraws, and the selection comes back. */
  async function sendSheet(sheet, selector, nth, prop, value) {
    if (!dc.serve) return
    if (busy) return hint('Still saving the last change', 1200)
    busy = true
    // Set before asking: the server tells every page of the change, and that may redraw the frames before the answer.
    const keep = sel ? { file: sel.frame.file, key: sel.frame.key, cv: cvOf(primary()), copies: sel.els.length > 1 } : null
    pendingSelect = keep
    const drop = () => { if (pendingSelect === keep) pendingSelect = null }
    try {
      const res = await fetch('/api/sheet', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sheet, selector, nth, prop, value, name: dc.me || 'someone' }) })
      const body = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(body.error || `Saving failed (${res.status})`)
      if (body.same) return drop()
      dc.noteFileEdit?.()
      dc.reloadSheet(body.sheet, body.text)
    } catch (err) {
      drop()
      hint(err.message, 4000)
    } finally {
      busy = false
    }
  }
  /** What brings the selection as it is now back after its frame redraws: each element found again by its place,
   *  for an edit that moves nothing (a style). */
  function reselect() {
    const doc = sel.frame.doc
    const paths = sel.els.map((x) => {
      const p = []
      for (let n = x; n && n !== doc.body; n = n.parentElement) p.unshift([...n.parentElement.children].indexOf(n))
      return p
    })
    return (f) => {
      const back = paths.map((p) => p.reduce((n, i) => n?.children[i], f.doc.body)).filter(Boolean)
      if (back.length) select(f, back)
    }
  }

  const textsIn = () => [...new Set(sel.els.flatMap((x) => [x, ...x.querySelectorAll('*')]))].filter((x) => ownText(x) && editable(x) && cvOf(x) != null && !['script', 'style'].includes(x.localName))
  /** A text colour for a selection that is not itself text (a group, a card): every line in it takes it, over any
   *  colour of its own, in one edit, as a text colour on a Figma group colours every text in it. */
  function styleTexts(props) {
    const texts = textsIn()
    if (!texts.length) return
    for (const x of texts) for (const [k, v] of Object.entries(props)) x.style.setProperty(k, v)
    send({ op: 'styles', items: texts.map((x) => ({ cv: cvOf(x), props })) }, { then: reselect() })
  }
  const colourTexts = (value) => styleTexts({ color: value })
  /** Whether the selection is every copy of one kind (Alt + click, Select every copy), whose style is one rule. */
  function everyCopy() {
    if (!sel || sel.els.length < 2) return false
    const el = primary()
    if (!sel.els.every((x) => sameKind(x, el))) return false
    const all = copiesOf(el)
    return all.length === sel.els.length && all.every((x) => sel.els.includes(x))
  }
  /** A style change to the selection: inline on one element, a rule for every copy, or on each element picked. */
  function setStyle(props) {
    if (!sel) return
    const el = primary()
    if (!sel.els.every(editable)) return dc.serve && hint(notEditable(el), 3000)
    // While Properties shows a state (hover, pressed, focus), the toolbar changes that state too.
    const state = sel.els.length === 1 ? dc.stateRuleFor?.(el) : null
    if (state) return send({ op: 'rule', selector: state, props, cv: cvOf(el) })
    // Every copy selected (Alt + click, or Select every copy): one rule they all follow.
    if (everyCopy()) {
      for (const x of sel.els) for (const [k, v] of Object.entries(props)) x.style.setProperty(k, v || '')
      return send({ op: 'rule', selector: copiesSelector(el), props, cv: cvOf(el) }, { copies: true })
    }
    // Several picked by hand (Shift + click), alike or not: each takes the style itself, in one edit, and the same
    // ones stay selected, found again by their places since a style moves nothing.
    if (sel.els.length > 1) {

  }
  const notEditable = (el) => (!dc.serve ? dc.readOnly : el && fileLocked(fileOf(el)) ? 'This artboard is locked by its owner.' : el && lockedEl(el) ? 'This part is locked by its owner.' : el && cvOf(el) == null ? 'This element is made by the prototype\'s own script, so it can be inspected and not edited.' : 'Nothing editable is selected.')
  /** Ctrl+Z: the board undoes its own last step; a prototype edit is undone by the server. */
  async function undoLast(redo) {

  }
  async function undo(redo = false) {

    const res = await fetch(redo ? '/api/redo' : '/api/undo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: dc.me || 'someone' }) })
    const body = await res.json().catch(() => ({}))

    if (body.none) return drop(), hint(redo ? 'Nothing to redo' : 'Nothing to undo', 1200)
    if (body.sheet) {

      p.value = v.value = ''
      onAdd(name, value)
    }
    for (const x of [p, v]) x.addEventListener('keydown', (e) => {
      e.stopPropagation()
      if (e.key === 'Enter') go()
    })
    v.addEventListener('change', go)
    return h('div', { class: 'decl add' }, p, v)
  }

  // ── tweaks ──
  function renderTweaks() {
    const host = $('#tweaks')
    host.replaceChildren()
    const f = ed.sel?.frame ?? tweaksFrame ?? dc.frames.find((x) => x.meta.levers?.length) ?? null
    if (!f) return host.append(h('div', { class: 'empty' }, 'Select a frame to see its tweaks.'))
    const levers = f.meta.levers ?? []
    host.append(h('div', { class: 'ptitle' }, f.label))
    if (!levers.length) {
      host.append(h('div', { class: 'empty' }, dc.commenting ? 'This design has no tweakable controls yet. Describe what you want to adjust and the agent will add levers for it.' : 'This design has no tweakable controls.'),
        dc.commenting ? h('div', { class: 'row pad' }, h('button', { type: 'button', class: 'btn', onclick: () => askForLevers(f) }, 'Ask the agent for levers')) : null)
      return
    }
    if (!f.doc) return host.append(h('div', { class: 'empty' }, 'Scroll the frame into view to load it.'))
    const root = f.doc.documentElement
    // Where a lever is declared, the last :root to declare it winning as in the cascade: a stylesheet the screens link
    // (changed there, so every screen linking it follows), or null for the prototype's own.
    const rootKey = sameSelector(':root')
    const homeOf = (name) => {
      let home = null
      for (const sheet of f.doc.styleSheets) {
        const node = sheet.ownerNode
        if (node?.localName !== 'style' || node.hasAttribute('data-canvas')) continue
        const linked = node.getAttribute('data-dc-sheet')
        let rules
        try { rules = sheet.cssRules } catch { continue }
        let nth = 0
        const walk = (list, top) => {
          for (const r of list) {
            if (r.cssRules && !r.selectorText) { walk(r.cssRules, false); continue }
            if (!r.selectorText || sameSelector(r.selectorText) !== rootKey) continue
            if (top && r.style.getPropertyValue(name)) home = linked == null ? null : { sheet: linked, nth }
            nth++
          }
        }
        walk(rules, true)
      }
      return home
    }
    for (const name of levers) {
      const value = cs(root).getPropertyValue(name).trim()
      if (!dc.serve) {
        host.append(field(name, h('span', { class: 'val' }, value)))
        continue
      }
      const home = homeOf(name)
      const commit = (v) => (home && !dc.local && !home.sheet.split('/').includes('..')
        ? ed.sendSheet(home.sheet, ':root', home.nth, name, v)
        : ed.send({ op: 'rule', selector: ':root', props: { [name]: v } }, { file: f.file, key: f.key }))
      const live = (v) => root.style.setProperty(name, v)
      host.append(field(name, leverControl(value, live, commit)))
    }
  }
  /** A colour lever keeps its alpha; a number lever gets a slider sized to its unit, beside a field for an exact value. */
  function leverControl(value, live, commit) {
    if (/^(#|rgb|hsl)/i.test(value)) {
      const ctx = document.createElement('canvas').getContext('2d')
      ctx.fillStyle = value
      const alpha = /^rgba/.test(ctx.fillStyle) ? Number(/,\s*([\d.]+)\)$/.exec(ctx.fillStyle)[1]) : 1
      const out = (hex) => {
        if (alpha === 1) return hex
        const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16))
        return `rgba(${r}, ${g}, ${b}, ${alpha})`
      }
      const c = h('input', { type: 'color', value: ed.rgbHex(value) })
      c.addEventListener('input', () => live(out(c.value)))
      c.addEventListener('change', () => commit(out(c.value)))
      return alpha === 1 ? c : h('div', { class: 'pc' }, c, h('span', { class: 'val' }, `${Math.round(alpha * 100)}% opaque`))
    }
    const m = /^(-?(?:\d+\.?\d*|\.\d+))(px|rem|em|%|vw|vh|deg|ms|s)?$/.exec(value)
    if (!m) return input(value, commit)
    const n = Number(m[1])
    const unit = m[2] ?? ''
    let min, max, step
    if (!unit && n >= 0 && n <= 1 && !Number.isInteger(n)) [min, max, step] = [0, 1, 0.01]
    else {
      const span = Math.max({ rem: 4, em: 4, '%': 100, deg: 360, s: 2, ms: 1000, '': 10 }[unit] ?? 100, Math.ceil(Math.abs(n) * 4))
      ;[min, max] = [n < 0 ? -span : 0, span]
      step = unit === 'rem' || unit === 'em' || unit === 's' || (!unit && !Number.isInteger(n)) ? 0.05 : 1
    }
    const r = h('input', { type: 'range', min, max, step, value: n })
    const num = h('input', { type: 'number', step, value: n, 'aria-label': 'Exact value' })
    const tidy = (v) => String(Math.round(Number(v) * 1000) / 1000)
    r.addEventListener('input', () => { num.value = tidy(r.value); live(`${tidy(r.value)}${unit}`) })
    r.addEventListener('change', () => commit(`${tidy(r.value)}${unit}`))
    num.addEventListener('input', () => { if (num.value !== '') { r.value = num.value; live(`${tidy(num.value)}${unit}`) } })
    num.addEventListener('change', () => { if (num.value !== '') commit(`${tidy(num.value)}${unit}`) })
    return h('div', { class: 'pc lever' }, r, num, h('span', { class: 'val unit' }, unit))
  }
  async function askForLevers(f) {
    const name = dc.me || (await dc.question('Your name, to sign the request:')) || ''
    if (!name.trim()) return
    dc.setName(name)
    const res = await fetch('/api/canvas-comments', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ event: { op: 'add', name, agent: true, frame: f.key, x: 24, y: 24, text: `Add tweakable levers to ${f.file}: name the CSS variables worth tuning in <meta name="canvas-levers" content="--a, --b">, defining them in :root if they are not yet.` } }) })
    if (res.ok) {
      dc.hint('Asked the agent for levers', 1800)
      dc.renderPins()
    } else dc.hint('Could not save the request', 3000)
  }

  // ── keeping it current ──
  let queued = false
  function render() {
    if (queued) return
    queued = true
    requestAnimationFrame(() => {
      queued = false
      if (!document.body.classList.contains('panel-open')) return clearStateShown()
      const tab = dc.currentTab()
      if (tab !== 'properties') clearStateShown()
      if (tab === 'properties') {
        renderLayers()
        renderProps()
      } else if (tab === 'code') {
        renderLayers()
        renderCode()
      } else if (tab === 'tweaks') renderTweaks()
    })
  }
  ed.onChange = render
  ed.onFrameLoad = (f) => {
    if (ed.sel?.frame === f || openFrames.has(f.key) || dc.currentTab() === 'tweaks') render()
  }
  hooks.onTab = render
  hooks.onPanel = render
  hooks.onTweaks = (f) => {
    tweaksFrame = f
    render()
  }
  const onPage = hooks.onPage
  hooks.onPage = (id) => {
    onPage?.(id)
    tweaksFrame = null
    render()
  }
  dc.renderPanel = render
})()

// Editing with no server. A canvas opened from disk in Chrome or Edge asks once for its own
// folder (the File System Access API), then answers every /api/ call the page makes itself: an
// edit is applied with the same engine the server uses (canvasHtml, inlined from lib/html.mjs)
// and written into the prototype's file, and every comment, edit and board line is written into
// canvas.html, with the prototype's inlined copy refreshed so the file opened later shows it.
// The folder is remembered (IndexedDB), so after the first time Edit only asks to allow it again.
//
// A canvas built with "play" in its layout and opened from a website edits with no folder: the
// same answers, from the prototypes inlined in the page, and every change kept in that browser
// (localStorage) for that visitor alone.
;(() => {
  const dc = window.designCanvas
  const data = dc.data
  const mode = document.getElementById('canvas-mode')
  const supported = typeof window.showDirectoryPicker === 'function'
  const play = dc.web && !!data.play && !data.serve
  if (!play && location.protocol !== 'file:' && !new URLSearchParams(location.search).has('local')) return
  if (data.serve) return

  // ── remembering the folder ──
  const idb = () =>
    new Promise((resolve, reject) => {
      const req = indexedDB.open('design-canvas', 1)
      req.onupgradeneeded = () => req.result.createObjectStore('folders')
      req.onsuccess = () => resolve(req.result)
      req.onerror = () => reject(req.error)
    })
  const remember = async (handle) => {
    try {
      const db = await idb()
      db.transaction('folders', 'readwrite').objectStore('folders').put(handle, data.key)
    } catch {}
  }
  const recall = async () => {
    try {
      const db = await idb()
      return await new Promise((resolve) => {
        const req = db.transaction('folders').objectStore('folders').get(data.key)
        req.onsuccess = () => resolve(req.result ?? null)
        req.onerror = () => resolve(null)
      })
    } catch {
      return null
    }
  }

  // ── the folder's files ──
  let dir = null
  let canvasName = 'canvas.html'
  let canvasText = ''
  const raw = new Map()
  const seen = new Map()
  let lines = []
  const undo = []
  const redo = []
  let selection = null
  const fileHandle = async (rel, create = false) => {
    const parts = rel.replace(/\\/g, '/').split('/').filter((p) => p && p !== '.')
    let d = dir
    for (const p of parts.slice(0, -1)) {
      if (p === '..') throw new Error(`${rel} is outside the folder`)
      d = await d.getDirectoryHandle(p)
    }
    return d.getFileHandle(parts[parts.length - 1], { create })
  }
  const readText = async (rel) => (await (await fileHandle(rel)).getFile()).text()

  // ── playing: what this visitor changed, kept in their browser ──
  const keepKey = `dc:${data.key}:play`
  let builtLines = 0
  const builtFiles = new Set()
  const edited = new Set()
  let full = false
  const keep = () => {
    const made = (data.loose ?? []).filter((l) => !builtFiles.has(l.file))
    const kept = {
      lines: lines.slice(builtLines),
      files: Object.fromEntries([...edited].map((f) => [f, raw.get(f)])),
      loose: made,
      meta: Object.fromEntries(made.map((l) => [l.file, data.meta[l.file]])),
    }
    try {
      localStorage.setItem(keepKey, JSON.stringify(kept))
    } catch {
      if (!full) dc.hint('This browser has no room to keep more changes: they last until the page is closed', 5000)
      full = true
    }
  }
  const kept = () => {
    try {
      return JSON.parse(localStorage.getItem(keepKey))
    } catch {
      return null
    }
  }

  // One write at a time, in the order asked.
  let queue = Promise.resolve()
  const write = (rel, text) => {
    if (play) {
      edited.add(rel)
      keep()
      return Promise.resolve()
    }
    queue = queue.then(async () => {
      const w = await (await fileHandle(rel, true)).createWritable()
      await w.write(text)
      await w.close()
      const f = await (await fileHandle(rel)).getFile()
      seen.set(rel, f.lastModified)
    })
    return queue
  }

  // A prototype made self-contained, as build does: its stylesheets shared as assets, its local
  // scripts and pictures inlined, so it draws in a frame that has no address of its own.
  const local = (ref) => ref && !/^(data:|https?:|\/\/|#|mailto:|about:|javascript:|blob:)/i.test(ref)
  const mime = { css: 'text/css', js: 'text/javascript', svg: 'image/svg+xml', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', woff2: 'font/woff2', woff: 'font/woff' }
  const dataUrl = async (rel) => {
    const file = await (await fileHandle(rel)).getFile()
    const bytes = new Uint8Array(await file.arrayBuffer())
    let bin = ''
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000))
    return `data:${mime[rel.split('.').pop().toLowerCase()] ?? 'application/octet-stream'};base64,${btoa(bin)}`
  }
  const replaceAsync = async (text, re, fn) => {
    const parts = []
    let at = 0
    for (const m of text.matchAll(re)) {
      parts.push(text.slice(at, m.index), await fn(...m))
      at = m.index + m[0].length
    }
    return parts.join('') + text.slice(at)
  }
  async function inline(html) {
    html = await replaceAsync(html, /<link\b[^>]*>/gi, async (tag) => {
      const href = /\bhref="([^"]+)"/i.exec(tag)?.[1]
      if (!href || !/stylesheet/i.test(/\brel="([^"]+)"/i.exec(tag)?.[1] ?? '')) return tag
      if (!local(href)) return ''
      const name = decodeURIComponent(href.split(/[?#]/)[0]).replace(/^\.\//, '')
      if (!data.assets[name]) {
        try {
          data.assets[name] = { type: 'text/css', text: await readText(name) }
        } catch {
          return tag
        }
      }
      return tag.replace(href, `__RC_ASSET__(${name})`)
    })
    html = await replaceAsync(html, /<script\b([^>]*)\ssrc="([^"]+)"([^>]*)><\/script>/gi, async (tag, a, src, b) => {
      if (!local(src)) return ''
      try {
        return `<script${a}${b}>${(await readText(src)).replace(/<\/script/gi, '<\\/script')}<\/script>`
      } catch {
        return tag
      }
    })
    html = await replaceAsync(html, /(<(?:img|source|video|audio)\b[^>]*?\s(?:src|poster)=")([^"]+)(")/gi, async (all, pre, ref, post) => {
      if (!local(ref)) return all
      try {
        return `${pre}${await dataUrl(decodeURIComponent(ref.split(/[?#]/)[0]))}${post}`
      } catch {
        return all
      }
    })
    return html
  }
  const served = async (file) => (play ? canvasHtml.tag(raw.get(file)) : inline(canvasHtml.tag(raw.get(file))))

  // ── canvas.html: its payload and its lines, rewritten after every change ──
  const sha = async (text) => {
    const d = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(text))
    return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16)
  }
  const OPEN = '<script type="application/json" id="rc-data">'
  const LINE = /^<\!-- (?:comment|edit|board) \{.*\} -->\r?\n/gm
  async function writeCanvas(changed = []) {
    let text = canvasText
    if (changed.length) {
      const a = text.indexOf(OPEN) + OPEN.length
      const b = text.indexOf('<\/script>', a)
      const payload = JSON.parse(text.slice(a, b))
      for (const file of changed) payload.files[file] = play ? raw.get(file) : await inline(raw.get(file))
      payload.assets = data.assets
      payload.meta = data.meta
      payload.loose = data.loose
      const json = JSON.stringify(payload).replace(/</g, '\\u003c').replace(/>/g, '\\u003e')
      text = text.slice(0, a) + json + text.slice(b)
    }
    text = text.replace(LINE, '')
    const end = text.lastIndexOf('</body>')
    text = `${text.slice(0, end)}${lines.map((l) => `${l}\n`).join('')}${text.slice(end)}`
    canvasText = text
    if (play) keep()
    else await write(canvasName, text)
  }
  const lineOf = (event, kind) => `<\!-- ${kind} ${JSON.stringify(event).replace(/--/g, '-\\u002d')} -->`

  // The change an edit made, in words, for its edit line.
  const describe = (src, cv) => {
    const el = cv == null ? null : canvasHtml.parse(src).byStart.get(Number(cv))
    if (!el) return ''
    const cls = el.attrs.find((x) => x.name === 'class')?.value.trim().split(/\s+/).slice(0, 2).join('.')
    const name = el.attrs.find((x) => x.name === 'data-name')?.value
    return name ? `"${name}"` : `<${el.tag}${cls ? `.${cls}` : ''}>`
  }
  const props = (p) => Object.entries(p).map(([k, v]) => `${k}: ${v === '' || v == null ? '(removed)' : v}`).join('; ')
  const summarize = (src, edit) => {
    const what = edit.cv == null ? '' : describe(src, [edit.cv].flat()[0])
    switch (edit.op) {
      case 'styles': return `${(edit.items ?? []).length} elements: ${(edit.items ?? []).map((it) => `${describe(src, it.cv)} ${props(it.props)}`).join(' · ')}`
      case 'style': return `${what} ${props(edit.props)}`
      case 'decl': return `${edit.selector} ${edit.prop}: ${edit.value === '' || edit.value == null ? '(removed)' : edit.value}`
      case 'rule': return `${edit.selector} ${props(edit.props)}`
      case 'inner': return `${what} now reads "${edit.html.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim().slice(0, 140)}"`
      case 'attr': return `${what} ${edit.name}=${JSON.stringify(edit.value ?? null)}`
      case 'move': return `${what} moved ${edit.where} ${describe(src, edit.target)}`
      case 'insert': return `new ${edit.html.slice(0, 80)} ${edit.where ?? 'inside'} ${what}`
      case 'replaceText': return `replaced ${JSON.stringify(String(edit.find).slice(0, 80))} with ${JSON.stringify(String(edit.with ?? '').slice(0, 80))} in the text`
      default: return `${edit.op} ${what}`
    }
  }

  // ── the /api/ answers ──
  const answer = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'content-type': 'application/json' } })
  const nameOf = (n) => String(n || 'someone').slice(0, 80)
  async function handle(url, init) {
    const u = new URL(url, location.href)
    const body = init?.body ? JSON.parse(init.body) : {}
    const post = (init?.method ?? 'GET').toUpperCase() === 'POST'
    const known = (file) => raw.has(file)
    const locks = () => foldBoard(parseLines(lines.join('\n'), 'board')).locked
    switch (u.pathname.replace(/^.*?(\/api\/)/, '$1')) {
      case '/api/canvas-comments': {
        if (!post) return answer(200, { events: parseEvents(lines.join('\n')), viewer: null })
        const event = makeEvent(body.event)
        // A visitor answers the owner's comments but does not delete or resolve them.
        if (play && (event.op === 'delete' || event.op === 'resolve')) {
          const own = parseEvents(lines.slice(0, builtLines).join('\n')).flatMap((e) => [e.id].filter(Boolean))
          if (own.includes(event.to)) return answer(403, { error: 'That comment belongs to the owner' })
        }
        lines.push(lineOf(event, 'comment'))
        await writeCanvas()
        return answer(200, { event })
      }
      case '/api/board': {
        if (!post) {
          const events = parseLines(lines.join('\n'), 'board')
          return answer(200, { events, board: foldBoard(events) })
        }
        const event = makeBoardEvent(body.event)
        const held = locks()
        if (play && event.op === 'lock') return answer(403, { error: 'Only the owner locks and unlocks' })
        if (held.includes(event.op === 'move' ? event.key : event.id) && ['item', 'remove', 'move'].includes(event.op)) return answer(403, { error: 'That is locked' })
        lines.push(lineOf(event, 'board'))
        await writeCanvas()
        return answer(200, { event })
      }
      case '/api/file': {
        const file = u.searchParams.get('f')
        if (!known(file)) return answer(404, { error: `${file} is not on this canvas` })
        return answer(200, { html: await served(file) })
      }
      case '/api/source': {
        const file = u.searchParams.get('f')
        if (!known(file)) return answer(404, { error: `${file} is not on this canvas` })
        const src = raw.get(file)
        const el = canvasHtml.parse(src).byStart.get(Number(u.searchParams.get('cv')))
        return answer(200, { html: el ? src.slice(el.start, el.end) : null })
      }
      case '/api/edit': {
        const { file, edit, name } = body
        if (!known(file)) return answer(404, { error: `${file} is not on this canvas` })
        const before = raw.get(file)
        if (locks().some((k) => k === file || k.startsWith(`${file}#`))) return answer(403, { error: 'This artboard is locked' })
        const refused = canvasHtml.lockedFor(before, edit, { owner: !play })
        if (refused) return answer(403, { error: refused })
        const result = canvasHtml.applyEdit(before, edit)
        if (result.src === before) return answer(200, { select: result.select, html: await served(file), same: true })
        raw.set(file, result.src)
        await write(file, result.src)
        undo.push({ file, before, after: result.src })
        redo.length = 0
        lines.push(lineOf({ op: edit.op, id: randomId('e'), at: new Date().toISOString(), name: nameOf(name), file, summary: summarize(before, edit).slice(0, 600), sha: await sha(result.src) }, 'edit'))
        await writeCanvas([file])
        return answer(200, { select: result.select, linked: result.linked ?? 0, count: result.count, html: await served(file) })
      }
      case '/api/undo':
      case '/api/redo': {
        const back = u.pathname.endsWith('/undo')
        const step = (back ? undo : redo).pop()
        if (!step) return answer(200, { none: true })
        const now = play ? raw.get(step.file) : await readText(step.file)
        if (now !== (back ? step.after : step.before)) {
          ;(back ? undo : redo).push(step)
          return answer(409, { error: `${step.file} changed outside the canvas since; nothing was undone` })
        }
        const want = back ? step.before : step.after
        raw.set(step.file, want)
        await write(step.file, want)
        ;(back ? redo : undo).push(step)
        lines.push(lineOf({ op: back ? 'undo' : 'redo', id: randomId('e'), at: new Date().toISOString(), name: nameOf(body.name), file: step.file, summary: back ? 'undid the last edit' : 'redid an edit', sha: await sha(want) }, 'edit'))
        await writeCanvas([step.file])
        return answer(200, { file: step.file, html: await served(step.file) })
      }
      case '/api/selection':
        if (post) {
          selection = body.selection ?? null
          return answer(200, { ok: true })
        }
        return answer(200, { selection })
      case '/api/agent':
        return answer(200, { threads: foldEvents(parseEvents(lines.join('\n'))).filter((t) => t.agent && !t.resolved) })
      case '/api/history':
        return answer(200, { edits: parseLines(lines.join('\n'), 'edit') })
      case '/api/canvas':
        return new Response(canvasText, { headers: { 'content-type': 'text/html' } })
      case '/api/refresh':
        return answer(409, { error: 'Rebuilding lays the prototypes out again, which needs node: node scripts/canvas.mjs build <folder>' })
      case '/api/artboard': {
        // Copies of prototypes on the board (Ctrl+D on screens): each file copied whole to <name>-copy.html.
        if (Array.isArray(body.copies)) {
          const files = []
          const events = []
          for (const c of body.copies.slice(0, 20)) {
            const from = String(c?.from ?? '')
            if (!known(from)) return answer(404, { error: `${from} is not on this canvas` })
            const base = from.replace(/\.html$/, '').replace(/^.*\//, '').replace(/[^A-Za-z0-9-]+/g, '-').slice(0, 54)
            const dir = from.includes('/') ? from.slice(0, from.lastIndexOf('/') + 1) : ''
            const taken = async (f) => {
              if (raw.has(f)) return true
              if (play) return false
              try {
                await fileHandle(f)
                return true
              } catch {
                return false
              }
            }
            let file = `${dir}${base}-copy.html`
            for (let n = 2; await taken(file); n++) file = `${dir}${base}-copy-${n}.html`
            const html = raw.get(from)
            raw.set(file, html)
            await write(file, html)
            data.files[file] = await served(file)
            data.meta[file] = { ...(data.meta[from] ?? { levers: [], fluid: false, play: false }) }
            ;(data.loose ??= []).push({ file, hash: '', label: file.replace(/\.html$/, ''), w: Math.round(Number(c.w) || 1440), h: Math.round(Number(c.h) || 900) })
            const event = makeBoardEvent({ op: 'move', key: file, x: Number(c.x) || 0, y: Number(c.y) || 0, page: body.page, name: body.by })
            lines.push(lineOf(event, 'board'))
            files.push(file)
            events.push(event)
          }
          await writeCanvas(files)
          return answer(200, { files, events })
        }
        const base = String(body.name ?? '').trim().toLowerCase().replace(/\.html$/, '').replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60)
        if (!base) return answer(400, { error: 'the artboard needs a name' })
        const file = `${base}.html`
        if (/^canvas(-[a-z0-9-]+)?\.html$/.test(file)) return answer(400, { error: `${file} is the name of a canvas` })
        if (raw.has(file)) return answer(409, { error: `${file} is already on this canvas` })
        if (!play) {
          try {
            await fileHandle(file)
            return answer(409, { error: `${file} is already in the folder` })
          } catch {}
        }
        const w = Math.max(240, Math.min(3840, Math.round(Number(body.w) || 1440)))
        const title = String(body.name).trim().slice(0, 120).replace(/</g, '&lt;')
        const html = `<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${title}</title>\n${w === 1440 ? '' : `<meta name="canvas-width" content="${w}">\n`}<style>\n  body { margin: 0; font-family: system-ui, sans-serif; }\n</style>\n</head>\n<body>\n<main style="min-height: ${Math.max(240, Math.round(Number(body.h) || 900))}px">\n</main>\n</body>\n</html>\n`
        raw.set(file, html)
        await write(file, html)
        data.files[file] = await served(file)
        data.meta[file] = { levers: [], fluid: false, play: false }
        ;(data.loose ??= []).push({ file, hash: '', label: base, w, h: Math.max(480, Math.round(Number(body.h) || 900)) })
        const event = makeBoardEvent({ op: 'move', key: file, x: Number(body.x) || 0, y: Number(body.y) || 0, page: body.page, name: body.by })
        lines.push(lineOf(event, 'board'))
        await writeCanvas([file])
        return answer(200, { file, event })
      }
      default:
        return answer(404, { error: 'not found' })
    }
  }
  const realFetch = window.fetch.bind(window)
  let on = false
  window.fetch = (input, init) => {
    const url = typeof input === 'string' ? input : input.url
    if (on && /^(\/|\.\/|[^:]*\/)?api\//.test(url.replace(location.origin, ''))) {
      return handle(url, init).catch((err) => answer(400, { error: err.message }))
    }
    return realFetch(input, init)
  }

  /** Edit with the folder given: read every prototype and the canvas, then answer /api/ from them. */
  async function useFolder(handle) {
    dir = handle
    canvasName = decodeURIComponent(location.pathname.split('/').pop() || '') || 'canvas.html'
    if (!/\.html$/i.test(canvasName)) canvasName = 'canvas.html'
    try {
      canvasText = await readText(canvasName)
    } catch {
      throw new Error(`There is no ${canvasName} in that folder: pick the folder this canvas is in.`)
    }
    for (const file of Object.keys(data.files)) {
      try {
        raw.set(file, await readText(file))
        seen.set(file, (await (await fileHandle(file)).getFile()).lastModified)
      } catch {
        throw new Error(`${file} is not in that folder: pick the folder this canvas is in.`)
      }
    }
    lines = storedLines(canvasText)
    for (const file of raw.keys()) data.files[file] = await served(file)
    on = true
    dc.enableLocal(dir.name || "this folder")
    // A change made outside the canvas (an agent, a build script) redraws its frames.
    setInterval(async () => {
      if (document.visibilityState !== 'visible') return
      for (const file of raw.keys()) {
        try {
          const f = await (await fileHandle(file)).getFile()
          if (f.lastModified === seen.get(file)) continue
          seen.set(file, f.lastModified)
          const text = await f.text()
          if (text === raw.get(file)) continue
          raw.set(file, text)
          dc.fileChanged(file)
        } catch {}
      }
    }, 2000)
  }
  /** Edit from the page itself, as a visitor to the site it is on: nothing to pick, kept in this browser. */
  async function usePage() {
    canvasName = decodeURIComponent(location.pathname.split('/').pop() || '') || 'index.html'
    try {
      canvasText = await (await realFetch(location.pathname, { cache: 'no-store' })).text()
    } catch {
      canvasText = `<!doctype html>\n${document.documentElement.outerHTML}`
    }
    for (const file of Object.keys(data.files)) {
      raw.set(file, data.files[file])
      builtFiles.add(file)
    }
    lines = storedLines(document.documentElement.outerHTML)
    builtLines = lines.length
    const before = kept()
    if (before) {
      for (const l of before.loose ?? []) {
        if (builtFiles.has(l.file) || typeof before.files?.[l.file] !== 'string') continue
        ;(data.loose ??= []).push(l)
        data.meta[l.file] = before.meta?.[l.file] ?? { levers: [], fluid: false, play: false }
      }
      for (const [file, text] of Object.entries(before.files ?? {})) {
        if (typeof text !== 'string') continue
        raw.set(file, text)
        edited.add(file)
      }
      for (const l of before.lines ?? []) if (typeof l === 'string') lines.push(l)
    }
    for (const file of raw.keys()) data.files[file] = canvasHtml.tag(raw.get(file))
    on = true
    dc.enableLocal('here', 'Edit, draw and comment: everything is kept in this browser, for you alone', true)
    dc.refreshBoard()
  }
  if (play) {
    // A visitor takes back everything they changed: the canvas as it was published.
    dc.startOver = async () => {
      if (!(await dc.sure('Drop every change you made here and see the canvas as it was published?', 'Start over', true))) return
      try { localStorage.removeItem(keepKey) } catch {}
      location.reload()
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(usePage))
    else setTimeout(usePage)
    return
  }

  async function start() {
    try {
      let handle = await recall()
      if (handle && (await handle.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await handle.requestPermission({ mode: 'readwrite' })) !== 'granted') handle = null
      if (!handle) handle = await window.showDirectoryPicker({ id: 'design-canvas', mode: 'readwrite', startIn: 'desktop' })
      await useFolder(handle)
      await remember(handle)
      dc.hint(`Editing ${handle.name}: changes are saved into its files`, 2600)
    } catch (err) {
      if (err?.name !== 'AbortError') dc.hint(err.message, 5000)
    }
  }

  // The mode chip becomes the Edit button.
  const button = document.createElement('button')
  button.type = 'button'
  button.id = 'canvas-mode'
  button.className = 'mode edit'
  button.textContent = supported ? 'Viewing · Edit' : 'Viewing'
  button.title = supported ? 'Edit and comment here: pick the folder this canvas is in, once' : 'Editing from disk needs Chrome or Edge; anywhere else, serve it with node scripts/canvas.mjs serve <folder>'
  button.disabled = !supported
  button.addEventListener('click', () => !on && start())
  mode.replaceWith(button)
  dc.showEmpty?.()
  dc.useFolder = useFolder
  if (supported) dc.startLocal = () => !on && start()

  // A browser that cannot save says so up front, once per visit, and can be closed.
  if (!supported) {
    const banner = document.createElement('div')
    banner.id = 'banner'
    banner.setAttribute('role', 'status')
    const text = document.createElement('span')
    text.textContent = 'This browser can only view this canvas: it cannot save edits or comments to your files. Open canvas.html in Chrome or Edge to edit.'
    const close = document.createElement('button')
    close.type = 'button'
    close.className = 'tool'
    close.title = 'Close'
    close.setAttribute('aria-label', 'Close')
    close.textContent = '✕'
    close.addEventListener('click', () => {
      banner.remove()
      document.body.classList.remove('has-banner')
    })
    banner.append(text, close)
    document.body.append(banner)
    document.body.classList.add('has-banner')
  }
})()

</script>
