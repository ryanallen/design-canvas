<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="review-canvas" content="index:site">
<title>Design canvas</title>
<style>
/* The window: a dark board, the chrome around it, comments, Play. The editor's own look is editor.css. */
/* One plane of chrome over a quiet board. Monochrome: a tool that is on is white, and the one color,
   the accent, means only "selected" or "the thing to press". Surfaces are told apart by tone and a
   soft shadow, not by outlines; radii come in three sizes. */
:root {
  --bg: #0f0f11;
  --dot: #222226;
  --panel: #19191c;
  --panel-2: #242428;
  --panel-3: #303035;
  --group: #141416;
  --line: #2a2a2f;
  --ink: #f4f4f6;
  --ink-2: #a8a8b2;
  /* The faintest text is still 4.5:1 on every surface it sits on (bg, panel, panel-2). */
  --ink-3: #8a8a95;
  --accent: #3e6ae1;
  --accent-ink: #ffffff;
  --pin: #3e6ae1;
  --pin-done: #5c5d6a;
  --agent: #d97757;
  --frame-shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 18px 48px rgb(0 0 0 / 0.45);
  --danger: #ff6b81;
  --edge: inset 0 1px 0 rgb(255 255 255 / 0.06);
  --chrome-shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 12px 32px rgb(0 0 0 / 0.5);
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.ico { display: inline-flex; width: 16px; height: 16px; }
.ico svg { width: 16px; height: 16px; }

/* ── the board ─────────────────────────────────────────────── */
#viewport {
  position: fixed; inset: 0; overflow: hidden; touch-action: none;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: 24px 24px;
  cursor: default; user-select: none; -webkit-user-select: none;
}
body.tool-hand #viewport, body.space #viewport { cursor: grab; }
#viewport.panning { cursor: grabbing !important; }
body.tool-comment #viewport, body.tool-note #viewport, body.tool-rect #viewport, body.tool-ellipse #viewport, body.tool-stamp #viewport, body.tool-diamond #viewport, body.tool-triangle #viewport,
body.tool-line #viewport, body.tool-arrow #viewport, body.tool-pencil #viewport, body.tool-artboard #viewport,
body.tool-guide #viewport { cursor: crosshair; }
body.tool-text #viewport { cursor: text; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
/* Flows: never thinner on screen than 2px, drawn over the frames, never in the way of a click. */
#world svg.flows { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; z-index: 3; }
#world svg.flows path { fill: none; stroke: var(--accent); stroke-width: max(4px, calc(2px * var(--iz, 1))); opacity: 0.9; }
#world svg.flows circle { fill: var(--accent); r: max(7px, calc(4px * var(--iz, 1))); }
#world svg.flows marker path { fill: var(--accent); stroke: none; }
#overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.frame {
  position: absolute; background: #fff; box-shadow: var(--frame-shadow); overflow: hidden;
}
.frame iframe { border: 0; display: block; pointer-events: none; background: #fff; transform-origin: 0 0; }
.frame .placeholder {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: var(--panel-2); color: var(--ink-3); font-size: 40px;
}
.frame.picked { outline: calc(2px / var(--z, 1)) solid var(--accent); }
/* A screen's right edge, to drag its width: a thin line shown under the pointer, a wider strip to catch it. */
.frame-edge { position: absolute; width: calc(12px / var(--z, 1)); margin-left: calc(-6px / var(--z, 1)); cursor: ew-resize; z-index: 2; }
.frame-edge::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: calc(2px / var(--z, 1)); transform: translateX(-50%); background: var(--accent); opacity: 0; transition: opacity 0.12s; }
.frame-edge:hover::after, .frame-edge.dragging::after { opacity: 1; }
body.playing .frame-edge { display: none; }

/* An option's group: sized on the board, so it shrinks and grows with the screens it holds. */
.group { position: absolute; border-radius: 40px; background: var(--group); border: 4px solid var(--line); }
.group.recommended { border-color: var(--accent); }
.group.other { background: transparent; border-style: dashed; }
.group-head { position: absolute; color: var(--ink); }
.group-title { display: flex; align-items: center; gap: 36px; font-size: 80px; line-height: 1.15; font-weight: 650; }
.group.other .group-title { font-size: 56px; color: var(--ink-2); font-weight: 600; }
.group-title .letter {
  flex: none; width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink); color: var(--bg); font-size: 84px;
}
.group.recommended .group-title .letter { background: var(--accent); color: var(--accent-ink); }
.group-title .chip { font-size: 40px; font-weight: 600; color: var(--accent); border: 4px solid var(--accent); border-radius: 999px; padding: 6px 30px; }
.group-info {
  margin: 32px 0 0; max-width: 2600px; font-size: 44px; line-height: 1.4; color: var(--ink-2);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.group-info.empty { font-style: italic; color: var(--ink-3); }
.group-rule { position: absolute; width: 4px; background: var(--line); border-radius: 2px; }
.group-sub { position: absolute; font-size: 48px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

/* Labels sit on the world but keep a constant size on screen. */
.label { position: absolute; transform-origin: 0 0; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.frame-label {
  transform: scale(var(--iz, 1)) translateY(calc(-100% - 6px));
  width: calc(var(--w) * var(--z, 1)); min-width: 120px;
  color: var(--ink-2); font-size: 12px; cursor: grab;
}
.frame-label .name { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; padding: 2px 0; }
.frame-label .name:hover { color: var(--ink); }
/* Too narrow for the name and its buttons side by side: the name has its own line, the buttons under it. */
.frame-label.stack { flex-wrap: wrap; row-gap: 2px; }
.frame-label.stack .name { flex: 1 0 100%; }
.frame-label.narrow { min-width: 0; }
.frame-label.narrow button:not(.play) { display: none; }
.frame-label.narrow button.play { padding: 0 8px; }
.frame-label.narrow button.play .word { display: none; }
.frame-label button {
  flex: none; border: 0; background: transparent; border-radius: 5px;
  padding: 0 5px; height: 22px; font-size: 11px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px;
}
.frame-label button:hover { color: var(--ink); background: var(--panel-2); }
.frame-label button.width { font-variant-numeric: tabular-nums; }
.frame-label button.play { background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 0 10px; font-weight: 600; letter-spacing: 0.06em; }
.frame-label button.play:hover { background: var(--ink); color: var(--bg); }
/* With a mouse, a frame's secondary actions show when the pointer is on the frame or its label, or
   the keyboard is in the label; Play and a lock that is on always show. A finger sees them all. */
@media (hover: hover) {
  .frame-label button:not(.play):not(.lock.on) { opacity: 0; transition: opacity 0.12s var(--ease); }
  .frame:hover + .frame-label button:not(.play), .frame-label:hover button:not(.play),
  .frame-label:focus-within button:not(.play) { opacity: 1; }
  .frame:hover + .frame-label button.lock:not(.on), .frame-label:hover button.lock:not(.on) { opacity: 0.5; }
}
.frame-label button.lock { opacity: 0.5; }
.frame-label button.lock.on { opacity: 1; color: #f5b14c; }
.frame-label button.lock:disabled { cursor: default; background: transparent; }
.item.locked { cursor: default; }
.item.locked::after {
  /* Within a note's 18px padding at any zoom, so it never covers the text; zoomed out it shrinks with the note. */
  content: ''; position: absolute; right: min(calc(6px / var(--z, 1)), 5px); top: min(calc(6px / var(--z, 1)), 4px);
  width: min(calc(10px / var(--z, 1)), 12px); height: min(calc(10px / var(--z, 1)), 12px); border-radius: 50%; background: #f5b14c;
  box-shadow: 0 0 0 min(calc(2px / var(--z, 1)), 2px) rgb(0 0 0 / 0.35); pointer-events: none;
}
.item.locked.svg::after, .item.locked.title::after { display: none; }
.section-label {
  /* Clear of the tallest screen label (its name and the rows of its buttons), measured as the zoom changes. */
  transform: scale(var(--iz, 1)) translateY(calc(-100% - max(36px, var(--label-h, 24px) + 14px)));
  font-size: 15px; font-weight: 600; color: var(--ink);
}
.section-label { max-width: max(160px, calc(var(--w) * var(--z, 1) * 1px)); }
.section-label .name { overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 100%; }
.section-label small { font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: 2px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
body.tiny .frame-label { display: none; }
/* High enough that a comment pin on a frame's corner (28px tall) does not cover it. */
body.tiny .section-label { transform: scale(var(--iz, 1)) translateY(calc(-100% - 32px)); font-size: 13px; }
body.tiny .section-label small { display: none; }
/* Far out, a lock's dot would be bigger than what it is on; the padlock on the label says it close up. */
body.tiny .item.locked::after { display: none; }

/* ── board objects ─────────────────────────────────────────── */
.item { position: absolute; }
.item.image img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }
.item.note {
  padding: 18px 20px; font-size: 22px; line-height: 1.35; color: #1d1d20; white-space: pre-wrap; overflow: hidden;
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.35); border-radius: 4px; overflow-wrap: anywhere;
}
.item.note.with-by { padding-bottom: 46px; }
.item.note .by { position: absolute; left: 20px; bottom: 14px; font-size: 15px; line-height: 1; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 40px); pointer-events: none; user-select: none; }
.item.title { font-size: 96px; font-weight: 700; color: var(--ink); white-space: pre; line-height: 1.1; }
.item.rect { border: 4px solid var(--c, #8a8a96); border-radius: 6px; }
.item.ellipse { border: 4px solid var(--c, #8a8a96); border-radius: 50%; }
.item.rect, .item.ellipse { display: grid; place-items: center; padding: 12px; overflow: hidden; }
/* A stamp, as FigJam's: a glyph in a round badge, over what it is put on. */
.item.stamp { display: grid; place-items: center; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgb(0 0 0 / 0.25); font-size: 28px; line-height: 1; z-index: 5; user-select: none; }
.item.stamp.on { outline: 2px solid var(--accent); outline-offset: 2px; }
/* A picked note or shape's connector dots, a fixed size on the screen at any zoom. */
.connect { position: absolute; z-index: 6; width: calc(14px / var(--z, 1)); height: calc(14px / var(--z, 1)); margin: calc(-7px / var(--z, 1)) 0 0 calc(-7px / var(--z, 1)); border-radius: 50%; background: #fff; box-shadow: 0 0 0 calc(2px / var(--z, 1)) var(--accent, #3b82f6); cursor: crosshair; opacity: 0.85; }
.connect[data-side='n'] { translate: 0 calc(-22px / var(--z, 1)); }
.connect[data-side='s'] { translate: 0 calc(22px / var(--z, 1)); }
.connect[data-side='e'] { translate: calc(22px / var(--z, 1)) 0; }
.connect[data-side='w'] { translate: calc(-22px / var(--z, 1)) 0; }
.connect:hover { opacity: 1; background: var(--accent, #3b82f6); }
#stamp-bar .tool { width: 36px; font-size: 18px; }
#pen-bar .tool { width: 40px; display: grid; place-items: center; }
#pen-bar .pen-line { display: block; width: 22px; border-radius: 99px; }
#pen-bar .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--panel-3); padding: 0; margin: 0 1px; }
#pen-bar .swatch.on { border-color: var(--ink); }
/* A diamond or triangle: its outline drawn to its box, its words in the part of it wide enough to hold them. */
.item.diamond, .item.triangle { display: grid; place-items: center; padding: 25%; }
.item.triangle { padding: 42% 22% 6%; }
.item .form { position: absolute; left: 2px; top: 2px; width: calc(100% - 4px); height: calc(100% - 4px); overflow: visible; pointer-events: none; }
.item .form polygon { fill: none; stroke: var(--c, #8a8a96); stroke-width: 4px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
/* A filled shape: a light tint of its color inside its outline, its words still dark enough to read. */
.item.rect.filled, .item.ellipse.filled { background: color-mix(in srgb, var(--c, #8a8a96) 32%, var(--bg)); }
.item.filled .form polygon { fill: color-mix(in srgb, var(--c, #8a8a96) 32%, var(--bg)); }
/* Its words over the fill, which is drawn in a layer of its own. */
.item.filled .txt { position: relative; }
.item .txt { font-size: 28px; line-height: 1.3; color: var(--ink); text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 1ch; outline: none; }
.item.section {
  border: 3px solid color-mix(in srgb, var(--c, #8a8a96) 70%, transparent); border-radius: 16px;
  background: color-mix(in srgb, var(--c, #8a8a96) 9%, transparent);
}
/* A line or arrow, and a section's name, never draw thinner or smaller on screen than this, however far out the board is zoomed. */
.item.line path.ink, .item.arrow path.ink { stroke-width: max(4px, calc(2px * var(--iz, 1))); }
.item.line path.hit, .item.arrow path.hit { stroke-width: max(24px, calc(16px * var(--iz, 1))); }
.item.section .txt {
  position: absolute; left: 0; bottom: 100%; margin-bottom: max(14px, calc(6px * var(--iz, 1))); font-size: max(44px, calc(16px * var(--iz, 1))); font-weight: 650; text-align: left;
  white-space: pre; color: var(--ink-2);
}
.frame.chosen { outline: calc(3px / var(--z, 1)) solid var(--accent); outline-offset: calc(6px / var(--z, 1)); }
.draft-shape.marquee { background: color-mix(in srgb, var(--accent) 8%, transparent); }
#itembar .count-note { font-size: 12px; color: var(--ink-2); padding: 0 6px; }
.item.svg { overflow: visible; }
.item.svg .line-label {
  position: absolute; transform: translate(-50%, -50%); padding: 4px 12px; border-radius: 8px; min-width: 1ch;
  background: var(--bg); font-size: 26px; white-space: pre; z-index: 1;
}
.item.svg .line-label:empty::before { content: '\200b'; }
.item.svg svg { overflow: visible; display: block; }
.item.guide { pointer-events: none; display: grid; }
.item.guide span { background: rgb(255 64 129 / 0.14); border-left: 1px solid rgb(255 64 129 / 0.5); border-right: 1px solid rgb(255 64 129 / 0.5); }
.item.editing { outline: calc(2px / var(--z, 1)) solid var(--accent); cursor: text; }
.item.on { outline: calc(2px / var(--z, 1)) solid var(--accent); outline-offset: calc(2px / var(--z, 1)); }
.draft-shape { position: absolute; border: calc(2px / var(--z, 1)) dashed var(--accent); pointer-events: none; }
/* The box round a selection of several, so it reads as one thing; solid for a group. */
.chosen-box { position: absolute; pointer-events: none; outline: calc(1.5px / var(--z, 1)) dashed var(--accent); outline-offset: calc(8px / var(--z, 1)); }
.chosen-box.grouped { outline-style: solid; }
/* The line a dragged object has caught on. */
.snap-line { position: absolute; pointer-events: none; z-index: 50; background: rgb(255 64 129); }
.snap-line.v { width: calc(1.5px / var(--z, 1)); margin-left: calc(-0.75px / var(--z, 1)); }
.snap-line.h { height: calc(1.5px / var(--z, 1)); margin-top: calc(-0.75px / var(--z, 1)); }
body.item-dragging .connect { display: none; }
/* A board object's size while it is resized, under it. */
.size-tag { position: absolute; pointer-events: none; z-index: 50; transform: translate(-50%, calc(8px / var(--z, 1))); background: #3b82f6; color: #fff; font: 600 calc(11px / var(--z, 1)) / 1 system-ui, sans-serif; padding: calc(3px / var(--z, 1)) calc(6px / var(--z, 1)); border-radius: calc(4px / var(--z, 1)); white-space: nowrap; font-variant-numeric: tabular-nums; }
/* Alt measuring on the board: red where the snap marks are pink, the object pointed at outlined. */
.snap-gap.measure { background: rgb(242 72 34); }
.snap-gap.measure span { background: rgb(242 72 34); }
.measure-to { position: absolute; pointer-events: none; z-index: 50; outline: calc(1.5px / var(--z, 1)) solid rgb(242 72 34); }
/* An equal gap while dragging, as Figma's smart spacing: a pink bar across it, its width on a pink tag. */
.snap-gap { position: absolute; pointer-events: none; z-index: 50; display: flex; align-items: center; justify-content: center; }
.snap-gap.h { height: calc(1.5px / var(--z, 1)); margin-top: calc(-0.75px / var(--z, 1)); background: rgb(255 64 129); }
.snap-gap.v { width: calc(1.5px / var(--z, 1)); margin-left: calc(-0.75px / var(--z, 1)); background: rgb(255 64 129); }
.snap-gap span { background: rgb(255 64 129); color: #fff; font: 600 calc(11px / var(--z, 1)) / 1 system-ui, sans-serif; padding: calc(2px / var(--z, 1)) calc(4px / var(--z, 1)); border-radius: calc(3px / var(--z, 1)); white-space: nowrap; }

/* ── pins ──────────────────────────────────────────────────── */
.pin {
  position: absolute; transform-origin: 0 0;
  transform: scale(var(--iz, 1)) translate(-4px, -100%);
  width: 28px; height: 28px; border-radius: 14px 14px 14px 2px;
  background: var(--pin); color: var(--accent-ink); border: 2px solid #fff;
  font-size: 12px; font-weight: 600; display: grid; place-items: center;
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.35); cursor: pointer; padding: 0;
}
.pin.agent { background: var(--agent); }
.pin.resolved { background: var(--pin-done); }
.pin.dragging { pointer-events: none; cursor: grabbing; opacity: 0.85; }
.pin.detached { border-style: dashed; }
.pin.active { outline: 3px solid color-mix(in srgb, var(--pin) 45%, transparent); }
.pin.pending { opacity: 0.6; }
/* Unread: a dot on the pin's corner, as Figma marks a comment not seen yet. */
.pin.unread::after { content: ""; position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ff4d4f; border: 2px solid #fff; }
.citem.unread .body { font-weight: 600; }
.citem.unread .meta::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff4d4f; align-self: center; }
body.hide-resolved .pin.resolved { display: none; }
body.pins-off .pins .pin { display: none; }

/* ── chrome ────────────────────────────────────────────────── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px;
  background: var(--bg); box-shadow: 0 1px 0 rgb(255 255 255 / 0.05);
}
.cluster { display: flex; align-items: center; gap: 4px; min-width: 0; }
#bar-left { flex: 1; }
.title-btn { min-width: 0; max-width: 40vw; }
.title-btn .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.caret { font-size: 10px; color: var(--ink-3); }
.sub { color: var(--ink-3); padding: 0 4px; white-space: nowrap; }
.mode { font-size: 11px; color: var(--ink-3); border: 0; background: var(--panel-2); border-radius: 999px; padding: 2px 10px 2px 8px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.mode::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
body.serving .mode { color: #7ee2a8; background: rgb(126 226 168 / 0.1); }
body.serving .mode::before { opacity: 1; box-shadow: 0 0 0 3px rgb(126 226 168 / 0.18); }
button.mode { background: none; font: inherit; font-size: 11px; cursor: pointer; }
button.mode:not(:disabled):hover { color: var(--ink); border-color: var(--ink-3); }
body:not(.serving) button.mode.edit:not(:disabled) { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
button.mode:disabled { cursor: default; }
.tool {
  height: 32px; min-width: 32px; padding: 0 10px; border: 0; border-radius: var(--r-sm); background: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink-2); white-space: nowrap;
  font-weight: 500; transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
}
.tool:hover { background: var(--panel-2); color: var(--ink); }
.tool[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
.tool:disabled { opacity: 0.4; cursor: default; }
a.tool { text-decoration: none; font-size: 13px; }
.zoom { min-width: 56px; font-variant-numeric: tabular-nums; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; flex: none; }
.count {
  min-width: 18px; height: 18px; border-radius: 9px; background: var(--panel-3); color: var(--ink-2);
  font-size: 11px; display: inline-grid; place-items: center; padding: 0 5px;
}
.tool[aria-pressed='true'] .count { background: rgb(0 0 0 / 0.12); color: inherit; }

/* The toolbar: one floating plane, every tool a circle on it. */
#artboard-sizes, #stamp-bar, #pen-bar {
  position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 10;
  display: flex; align-items: center; gap: 2px; padding: 4px 6px; border-radius: 999px;
  background: var(--panel); box-shadow: var(--chrome-shadow), var(--edge); white-space: nowrap; font-size: 13px;
}
#artboard-sizes .note { color: var(--ink-2); padding: 0 8px; font-size: 12px; }
#artboard-sizes .tool { width: auto; padding: 0 12px; border-radius: 999px; }

  #artboard-sizes { max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; }

}
#toolbar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;

#toolbar .more { min-width: 18px; padding: 0 4px 0 0; font-size: 9px; }
#toolbar .ask { color: var(--ink); background: var(--panel-2); padding: 0 16px; }
#toolbar .ask:hover { background: var(--panel-3); }
#toolbar .ask[aria-pressed='true'] { background: var(--agent); color: #fff; }

#ask {
  position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 11; width: min(520px, calc(100vw - 24px));
  background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--chrome-shadow), var(--edge);
  padding: 10px; display: none; gap: 8px;
}

#hint {
  position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 12;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 7px 16px; font-size: 12px; font-weight: 500;
  pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: calc(100vw - 24px);
}

/* ── menus ─────────────────────────────────────────────────── */
#menu {
  position: fixed; z-index: 40; min-width: 200px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto;
  background: var(--panel); border-radius: var(--r); box-shadow: var(--chrome-shadow), var(--edge);
  padding: 6px; display: none;
}

  display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left;
  padding: 7px 10px; border-radius: var(--r-sm); color: var(--ink); white-space: nowrap;
}
#menu .mi:hover:not(:disabled), #menu .mi:focus-visible { background: var(--panel-2); }
#menu .mi:focus-visible { outline: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
#menu .mi:disabled { color: var(--ink-3); cursor: default; }
#menu .mi.danger { color: var(--danger); }
#menu .mi .tick { width: 14px; flex: none; color: var(--accent); }

#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ── the right panel ───────────────────────────────────────── */
#panel {
  position: fixed; top: 48px; right: 0; bottom: 0; width: 320px; z-index: 9;
  background: var(--panel); box-shadow: -1px 0 0 rgb(255 255 255 / 0.05);
  display: none; flex-direction: column;
}
body.panel-open #panel { display: flex; }
#panel .tabs { display: flex; align-items: center; gap: 2px; padding: 8px 8px 8px; box-shadow: 0 1px 0 rgb(255 255 255 / 0.05); }
#panel .tabs [role='tab'] {
  border: 0; background: none; color: var(--ink-3); padding: 5px 9px; border-radius: 999px; font-weight: 500;
  transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
}
#panel .tabs [role='tab']:hover { color: var(--ink); }
#panel .tabs [role='tab'][aria-selected='true'] { color: var(--bg); background: var(--ink); }
#panel .tabs .close { margin-left: auto; height: 26px; min-width: 26px; }
#panel .tabs .close { flex: none; }
#toolbar > * { flex: none; }
#panel .tab-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
#panel .tab-body > #tweaks, #panel .tab-body[data-body='comments'] > .list { flex: 1; min-height: 0; overflow: auto; }
#panel .list-head { padding: 8px 12px; color: var(--ink-2); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
#panel .list-head input[type='search'] { flex: 1 1 100%; min-width: 0; height: 28px; padding: 3px 8px; border: 1px solid transparent; border-radius: 6px; background: var(--panel-2); color: var(--ink); font: inherit; font-size: 13px; }
#panel .list-head select { flex: none; margin-left: auto; background: var(--panel-2); color: var(--ink); border: 0; border-radius: 6px; padding: 3px 6px; font: inherit; }
#panel .list-head label { display: flex; gap: 4px; align-items: center; }
#panel .list-head #mark-read { flex: none; }
#panel .list { overflow: auto; flex: 1; padding: 6px; }
#panel .empty { color: var(--ink-3); padding: 16px 12px; }
#panel footer { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
#panel footer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); padding: 4px 6px; }
.citem {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px;
  padding: 8px 10px; color: var(--ink);
}
.citem:hover, .citem.active { background: var(--panel-2); }
.citem .meta { color: var(--ink-3); font-size: 11px; display: flex; gap: 6px; flex-wrap: wrap; }
.citem .meta .num { background: var(--pin); color: var(--accent-ink); border-radius: 8px; padding: 0 5px; font-weight: 600; }
.citem.agent .meta .num { background: var(--agent); }
.citem.resolved .meta .num { background: var(--pin-done); }
.citem .body { margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.citem .where { color: var(--ink-3); font-size: 11px; margin-top: 2px; }

/* ── thread popover ────────────────────────────────────────── */
#thread {
  position: fixed; z-index: 20; width: 300px; max-height: min(460px, calc(100vh - 24px));
  background: var(--panel); border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--chrome-shadow), var(--edge); display: none; flex-direction: column;
}
#thread.open { display: flex; }
#thread .head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); }
#thread .head b { flex: 1; min-width: 0; white-space: nowrap; }
#thread .head b .state { font-weight: 400; font-size: 11px; color: var(--ink-3); }
#thread .head .tool { height: 26px; min-width: 26px; padding: 0 6px; font-size: 12px; }
#thread .msgs { overflow: auto; padding: 4px 12px; }
.msg { padding: 8px 0; border-bottom: 1px solid var(--line); }
.msg:last-child { border-bottom: 0; }
.msg .who { display: flex; gap: 6px; align-items: baseline; }
.msg .who b { font-weight: 600; }
.msg .who span { color: var(--ink-3); font-size: 11px; flex: 1; }
.msg .who button { border: 0; background: none; color: var(--ink-3); font-size: 11px; padding: 0; }
.msg .who button:hover { color: var(--danger); }
.msg .who button.copy-link:hover { color: var(--ink); }
.msg p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .on { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

.msg .edit-msg { width: 100%; min-height: 56px; border: 1px solid var(--accent); border-radius: var(--r-sm); background: var(--panel-2); padding: 7px 10px; resize: vertical; font: inherit; color: inherit; }
.msg .editing-msg .row { display: flex; justify-content: flex-end; gap: 6px; }
.msg .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.msg .react { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 1px 7px; font-size: 12px; line-height: 18px; }
.msg .react.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.msg .react.add { color: var(--ink-3); }
.msg .react-pick { display: flex; gap: 4px; flex-basis: 100%; }
.msg .react-pick[hidden] { display: none; }
.msg .mention, #thread .mention { color: var(--accent); font-weight: 600; }
.mentions { display: grid; gap: 2px; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); }
.mentions[hidden] { display: none; }
.mentions button { text-align: left; border: 0; background: none; color: var(--ink); padding: 4px 8px; border-radius: 4px; font: inherit; }
.mentions button.on, .mentions button:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.composer { border-top: 1px solid var(--line); padding: 8px; display: grid; gap: 6px; }
.composer input, .composer textarea {
  width: 100%; border: 1px solid transparent; border-radius: var(--r-sm); background: var(--panel-2); padding: 7px 10px; resize: none;
}
.composer textarea { min-height: 56px; }
.composer input:focus, .composer textarea:focus, #ask textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.composer .row { display: flex; gap: 6px; align-items: center; }
.composer .row span { flex: 1; color: var(--ink-3); font-size: 11px; }
.composer .row label { display: flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 12px; flex: 1; white-space: nowrap; cursor: pointer; }
.composer input[type='checkbox'] { width: 16px; height: 16px; padding: 0; margin: 0; flex: none; accent-color: var(--agent); }
.btn { border: 0; border-radius: 999px; padding: 6px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; transition: filter 0.15s var(--ease); }
.btn:not(:disabled):hover { filter: brightness(1.12); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.quiet { background: transparent; color: var(--ink-2); font-weight: 400; }
.error { color: var(--danger); font-size: 12px; }

/* ── present ───────────────────────────────────────────────── */
#play { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; background: #0e0e10; }
#play.open { display: flex; }
#play .head { display: flex; align-items: center; gap: 4px; padding: 8px 10px; color: #fff; box-shadow: 0 1px 0 rgb(255 255 255 / 0.05); }
#play .head .tool { border-radius: 999px; }
#play .head b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
#play .head .tool { color: #d8d8e2; }
#play .head .tool:hover { background: rgb(255 255 255 / 0.12); color: #fff; }
#play .head .tool[aria-pressed='true'] { background: #fff; color: #111; }
#play-count { color: #a8a8b4; font-size: 12px; font-variant-numeric: tabular-nums; min-width: 40px; text-align: center; white-space: nowrap; }
#play-next { margin-right: 12px; }
#play .head .tool:disabled { opacity: 0.35; background: none; }
#play #play-close { font-size: 20px; }
#play .stage { flex: 1; overflow: auto; display: flex; padding: 12px; min-height: 0; }
#play iframe { border: 0; background: #fff; height: 100%; width: 100%; margin: 0 auto; flex: none; transform-origin: 0 0; }
#play.fit .stage { overflow: hidden; }
/* Commenting in Play: a click on the prototype drops a pin there; pins for this screen sit over it. */
#play .stage { position: relative; }
#play-catch { position: absolute; inset: 0; cursor: crosshair; }
#play-pins { position: fixed; inset: 0; pointer-events: none; }
#play-pins .pin { pointer-events: auto; transform: translate(-4px, -100%); }
body.playing #thread { z-index: 31; }

/* The page's own question box, in place of the browser's prompt and confirm. */
#dialog {
  width: min(360px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: var(--r-lg);
  background: var(--panel); color: var(--ink); box-shadow: var(--chrome-shadow), var(--edge);
}
#dialog::backdrop { background: rgb(0 0 0 / 0.45); }
#dialog form { display: grid; gap: 12px; padding: 16px; }
#dialog p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink); }
#dialog input {
  width: 100%; border: 1px solid transparent; border-radius: var(--r-sm); background: var(--panel-2);
  color: var(--ink); padding: 8px 10px; font: inherit;
}
#dialog input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
#dialog .row { display: flex; flex-direction: row-reverse; justify-content: flex-start; gap: 6px; }
#dialog .btn.danger { background: var(--danger); color: #1a0b0e; }
@media (pointer: coarse) { #dialog input { font-size: 16px; } #dialog .btn { min-height: 40px; padding: 0 18px; } }
/* An empty page: one quiet line in the middle of the board, gone once anything is on it. */
#empty {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; pointer-events: none;
  display: grid; gap: 6px; justify-items: center; text-align: center; max-width: calc(100vw - 48px);
  color: var(--ink-3); font-size: 13px;
}
#empty b { color: var(--ink-2); font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
#empty button {
  pointer-events: auto; border: 0; border-radius: 999px; padding: 3px 12px; margin-right: 2px;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px; cursor: pointer;
}
#empty .start { display: grid; gap: 10px; justify-items: center; }
#empty .start button { padding: 7px 16px; font-size: 14px; }
#empty .start button.link { padding: 0; margin: 0; border-radius: 0; background: none; color: var(--ink-2); font: inherit; text-decoration: underline; text-underline-offset: 2px; }
/* With a tool in hand the card has said what it had to: it steps aside, so a click in the middle of the page draws there. */
body:not(.tool-select) #empty { display: none; }
#empty kbd { font: 600 11px/1 ui-monospace, Consolas, monospace; padding: 2px 5px; border-radius: 4px; background: color-mix(in srgb, currentColor 14%, transparent); }
body.panel-open #empty { left: calc(50% - 160px); }
@media (max-width: 640px) { body.panel-open #empty { display: none; } }
/* What cannot work where the canvas is open is not shown: drawing and making need editing on,
   commenting needs somewhere to save comments. */
body:not(.serving) #toolbar [data-tool='text'], body:not(.serving) #toolbar [data-tool='artboard'],
body:not(.serving) #toolbar [data-tool='note'], body:not(.serving) #toolbar [data-tool='pencil'],
body:not(.serving) #toolbar .split, body:not(.serving) #toolbar .sep.edit-only,
body:not(.commenting) #toolbar [data-tool='comment'], body:not(.commenting) #toolbar #tool-ask,
body:not(.commenting) #toolbar .sep.comment-only { display: none !important; }
body:not(.serving) .frame-label { cursor: default; }

/* The banner under the top bar: a browser that can only view */
#banner {
  position: fixed; top: 48px; left: 0; right: 0; z-index: 11; min-height: 40px;
  display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 8px 4px 16px;
  background: #3a2f12; color: #f5d98b; border-bottom: 1px solid #5a4a1c; font-size: 13px; text-align: center;
}
#banner span { flex: 1; }
#banner .tool { color: #f5d98b; height: 28px; min-width: 28px; flex: none; }
#banner .tool:hover { background: rgb(255 255 255 / 0.1); color: #fff; }
body.has-banner #panel { top: 88px; }

/* A board object's own bar */
#itembar {
  position: fixed; z-index: 15; display: none; align-items: center; gap: 4px; padding: 4px;
  background: var(--panel); border-radius: 22px; box-shadow: var(--chrome-shadow), var(--edge); padding: 4px 6px;
  /* On a narrow screen it goes on to a second row rather than off the edge. */
  max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center;
}
#itembar.open { display: flex; }
#itembar .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel-3); padding: 0; }
#itembar .swatch.on { border-color: var(--ink); }
#itembar label { display: flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 11px; }
#itembar input { width: 48px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
#itembar .tool { height: 26px; }

/* A finger: Safari zooms the whole page into any field under 16px, so none is smaller; targets are
   a fingertip wide; nothing is hidden under the home bar or the notch. */
@media (pointer: coarse) {
  input, textarea, select, #panel input:not([type]), #panel input[type='text'], #panel select, #panel textarea { font-size: 16px !important; }
  #toolbar .tool { height: 44px; min-width: 44px; }
  #toolbar [data-tool='hand'] { display: none; }
  .tool { min-height: 40px; }
  #panel .tabs [role='tab'] { padding: 8px 6px; }
  #panel .tabs .close { min-width: 40px; height: 40px; }
  #menu .mi { min-height: 44px; }
  #menu .mi .dots { min-width: 36px; min-height: 36px; font-size: 16px; }
  .frame-label button { height: 30px; padding: 0 8px; }
}
#topbar { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
#toolbar { bottom: max(16px, env(safe-area-inset-bottom)); }
/* The toolbar sits in the middle of the board that shows, not under the panel. */
@media (min-width: 641px) {
  body.panel-open #toolbar { left: calc((100vw - 320px) / 2); max-width: calc(100vw - 336px); overflow-x: auto; scrollbar-width: none; }
}
/* Beside an open panel on a narrower window, Ask agent is its ✦ alone, as on a phone, so the tools fit. */
@media (min-width: 641px) and (max-width: 1100px) {
  body.panel-open #toolbar .ask { font-size: 0; padding: 0 12px; }
  body.panel-open #toolbar .ask::before { content: '✦'; font-size: 14px; }
}
/* Under 900 px the layout's links move into the canvas menu, so the canvas's name has the room. */
@media (max-width: 900px) { #bar-right a.link { display: none; } }

@media (max-width: 640px) {
  /* The thread is a sheet over the bottom of the screen, above the toolbar, never off its edge. */
  #thread { left: 8px !important; right: 8px !important; top: auto !important; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 66px) !important; width: auto; max-height: 55vh; }
  #ask { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 66px); }
  #bar-left .sep { display: none; }
  /* A finger pans with any tool that is not drawing, so the hand is not needed, and the rest fit. */
  #toolbar { left: 50%; right: auto; transform: translateX(-50%); max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; }
  #toolbar .tool { min-width: 38px; padding: 0 8px; }
  #toolbar .sep { margin: 0 2px; }
  #toolbar .ask { padding: 0 12px; }
  #hint { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 70px); }
  .sub, .mode, #page-name, .title-btn .caret, .pages-btn .caret { display: none; }
  /* The comment count rides on its icon as a badge, so the canvas's name has the room. */
  #tool-comments { position: relative; padding: 0 10px; }
  #tool-comments .count { position: absolute; top: 3px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px; line-height: 16px; }
  #bar-right { gap: 0; }
  .title-btn { max-width: 46vw; }
  #tool-play { padding: 0 10px; font-size: 0; }
  #tool-play::before { content: '▷'; font-size: 16px; }
  #toolbar .ask { font-size: 0; }
  #toolbar .ask::before { content: '✦'; font-size: 14px; }
  /* The sheet's last line (Commenting as) stays above the floating toolbar. */
  #panel { padding-bottom: calc(max(16px, env(safe-area-inset-bottom)) + 66px); }
  #panel { left: 0; width: auto; top: auto; height: 62vh; box-shadow: 0 -1px 0 rgb(255 255 255 / 0.06), 0 -12px 32px rgb(0 0 0 / 0.5); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  #play .head { overflow-x: auto; }
}
#itembar.dragging { visibility: hidden; }
/* Where a picked note, shape or section resizes from. */
.item .grip { position: absolute; right: calc(3px / var(--z, 1)); bottom: calc(3px / var(--z, 1)); width: calc(10px / var(--z, 1)); height: calc(10px / var(--z, 1)); background: #fff; border: calc(1.5px / var(--z, 1)) solid var(--accent); border-radius: calc(2px / var(--z, 1)); cursor: nwse-resize; box-sizing: border-box; }
/* Find and replace (Ctrl+F). */
#findbar { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 13; display: none; align-items: center; gap: 4px; padding: 4px 6px; background: var(--panel); border-radius: 999px; box-shadow: var(--chrome-shadow), var(--edge); max-width: calc(100vw - 16px); }
#findbar.open { display: flex; }
#findbar input { width: 160px; height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--panel-2); color: var(--ink); font: 13px system-ui, sans-serif; outline: none; }
#findbar input:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
#findbar .find-n { min-width: 64px; font-size: 12px; color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; }
#findbar .sep { width: 1px; height: 18px; background: var(--line, rgb(255 255 255 / 0.1)); margin: 0 4px; }
@media (pointer: coarse) { #findbar input { font-size: 16px; } }
@media (max-width: 640px) { #findbar input { width: 110px; } #findbar { flex-wrap: wrap; justify-content: center; border-radius: 16px; row-gap: 4px; left: 8px; right: 8px; transform: none; } }
/* Keyboard shortcuts sheet. */
#keys-sheet { width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 0; border-radius: var(--r-lg, 18px); background: var(--panel); color: var(--ink); box-shadow: var(--chrome-shadow), var(--edge); }
#keys-sheet::backdrop { background: rgb(0 0 0 / 0.45); }
#history-sheet { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 0; border-radius: var(--r-lg, 18px); background: var(--panel); color: var(--ink); box-shadow: var(--chrome-shadow), var(--edge); }
#history-sheet::backdrop { background: rgb(0 0 0 / 0.45); }
#history-sheet header { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 20px; background: var(--panel); }
#history-sheet header b { font-size: 15px; }
#history-sheet .hist-list { padding: 0 12px 16px; }
#history-sheet .hist-row { padding: 10px 8px; border-top: 1px solid var(--line); }
#history-sheet .hist-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
#history-sheet .hist-head b { color: var(--ink); font-size: 13px; }
#history-sheet .hist-head .file { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
#history-sheet .hist-head button { margin-left: auto; }
#history-sheet .hist-what { font-size: 13px; margin-top: 3px; color: var(--ink); overflow-wrap: anywhere; }
#history-sheet .empty { color: var(--ink-2); padding: 12px 8px; }
#keys-sheet header { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 20px; background: var(--panel); }
#keys-sheet header b { font-size: 15px; }
#keys-sheet .keys-cols { columns: 3 260px; column-gap: 28px; padding: 0 20px 20px; }
#keys-sheet section { break-inside: avoid; margin-bottom: 18px; }
#keys-sheet h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
#keys-sheet .key-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 13px; color: var(--ink-2); }
#keys-sheet kbd { font: 12px ui-monospace, Consolas, monospace; color: var(--ink); white-space: nowrap; }

/* Who else is here: their pointers over the board, their faces in the top bar. */
#peer-layer { position: fixed; inset: 0; pointer-events: none; z-index: 25; overflow: hidden; }
.peer-cursor { position: absolute; left: 0; top: 0; will-change: transform; transition: transform 60ms linear; }
.peer-cursor svg { display: block; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.35)); }
.peer-name { position: absolute; left: 14px; top: 16px; background: var(--c); color: #fff; font-size: 12px; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: 4px; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
#peers { display: flex; align-items: center; margin-right: 6px; }
#peers:empty { display: none; }
#peers .peer { width: 26px; height: 26px; border-radius: 50%; background: var(--c, #666); color: #fff; border: 2px solid var(--bg, #1d1d20); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0; margin-left: -6px; cursor: pointer; }
#peers .peer:first-child { margin-left: 0; }
#peers .peer.more { background: var(--ink-3, #777); cursor: default; }
@media (prefers-reduced-motion: reduce) { .peer-cursor { transition: none; } }
#follow-ring { position: fixed; inset: 0; border: 3px solid var(--c); pointer-events: none; z-index: 26; }
#follow-ring[hidden] { display: none; }
.follow-tag { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); background: var(--c); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 6px 5px 10px; border-radius: 6px; display: flex; gap: 8px; align-items: center; pointer-events: auto; white-space: nowrap; }
.follow-tag button { border: 0; background: rgb(255 255 255 / 0.25); color: #fff; font: inherit; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
.peer-sel { position: absolute; left: 0; top: 0; border: 2px solid var(--c); border-radius: 2px; box-sizing: border-box; }
.peer-chat { position: absolute; left: 14px; top: 38px; background: var(--c); color: #fff; font-size: 14px; line-height: 1.3; padding: 6px 10px; border-radius: 4px 12px 12px 12px; width: max-content; max-width: 260px; white-space: normal; overflow-wrap: anywhere; }
.peer-chat[hidden] { display: none; }
.my-chat { position: fixed; left: 0; top: 0; z-index: 27; }
.my-chat input { font: 14px/1.3 inherit; padding: 6px 10px; border-radius: 4px 12px 12px 12px; border: 2px solid var(--accent); background: var(--bg-2, #1d1d20); color: var(--ink); width: 240px; outline: none; }
#timer-chip { font: 600 13px/1 ui-monospace, monospace; padding: 6px 10px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-ink, #fff); margin-right: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
#timer-chip[hidden] { display: none; }
#timer-chip.done { background: var(--danger, #e5484d); color: #fff; animation: timer-pulse 0.8s ease-in-out 4; }
@keyframes timer-pulse { 50% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { #timer-chip.done { animation: none; } }
body.pointers-off .peer-cursor { display: none; }

/* The server's browser making a picture of the board: the board alone, from the window's top left. */
body.shooting > *:not(#viewport) { display: none !important; }
body.shooting #viewport { position: fixed; inset: 0; }
body.shooting #overlay, body.shooting .frame-label, body.shooting .frame-edge, body.shooting .pin, body.shooting .peer-cursor { display: none !important; }

/* A vote: a dot on what it is for. */
.item.stamp.vote { border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 calc(2px / var(--z, 1)) #fff, 0 1px 4px rgb(0 0 0 / 0.3); }
#vote-chip { font: 600 13px/1 system-ui, sans-serif; padding: 6px 10px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-ink, #fff); margin-right: 6px; cursor: pointer; }
#vote-chip[hidden] { display: none; }
body.voting .item:not(.stamp):not(.section) { cursor: copy; }

/* The bars hidden (Figma's Hide UI): the board alone, a small button in the corner to bring them back. */
body.ui-off #topbar, body.ui-off #toolbar, body.ui-off #panel, body.ui-off #float, body.ui-off #findbar, body.ui-off #artboard-sizes, body.ui-off #stamp-bar, body.ui-off #pen-bar, body.ui-off #itembar { display: none !important; }
#bars-back { display: none; position: fixed; right: 12px; bottom: 12px; z-index: 50; font: 500 12px/1 system-ui, sans-serif; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); cursor: pointer; opacity: 0.7; }
#bars-back:hover, #bars-back:focus-visible { opacity: 1; }
body.ui-off #bars-back { display: block; }
body.shooting #bars-back { display: none !important; }

/* A web address in a note or shape. */
.item a.board-link { color: inherit; text-decoration: underline; text-underline-offset: 0.15em; overflow-wrap: anywhere; }
.msg-link { color: var(--accent); text-decoration: underline; text-underline-offset: 0.15em; overflow-wrap: anywhere; }
#findbar .find-opt { font: 600 12px/1 ui-monospace, monospace; min-width: 30px; }
#findbar .find-opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); }
@media (max-width: 640px) { #vote-chip { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }

/* The editor's look: the selection box and handles, the floating toolbar, layers, Properties, Code, Tweaks. */
.ov { position: absolute; pointer-events: none; }
.ov.hover { outline: 1px solid var(--accent); }
.ov.sel { outline: 2px solid var(--accent); }
.ov.sel.copy { outline: 1.5px solid var(--accent); outline-offset: 0; opacity: 0.8; }
.ov.drop { background: var(--accent); }
.ov.ghost { border: 1.5px solid var(--accent); background: rgb(255 255 255 / 0.6); border-radius: 3px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.25); }
.ov.ghost span { position: absolute; left: 8px; top: 6px; max-width: calc(100% - 16px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 500 12px/1.3 system-ui, sans-serif; color: var(--accent); }
.ov-tag {
  position: absolute; left: -2px; bottom: calc(100% + 4px); white-space: nowrap; display: flex; gap: 6px; align-items: center;
  background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 4px; max-width: 420px; overflow: hidden;
}
.ov-tag span { opacity: 0.8; font-variant-numeric: tabular-nums; }
.handle {
  position: absolute; width: 8px; height: 8px; background: #fff; border: 1.5px solid var(--accent); pointer-events: auto;
}
.handle.nw { left: -5px; top: -5px; cursor: nwse-resize; }
.handle.ne { right: -5px; top: -5px; cursor: nesw-resize; }
.handle.sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
.handle.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
.handle.e { right: -5px; top: calc(50% - 4px); cursor: ew-resize; }
.handle.s { bottom: -5px; left: calc(50% - 4px); cursor: ns-resize; }
.mesh-lines { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.mesh-lines line { stroke: #fff; stroke-width: 1; stroke-opacity: 0.8; filter: drop-shadow(0 0 1px rgb(0 0 0 / 0.6)); }
.mesh-pt { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.35), 0 2px 6px rgb(0 0 0 / 0.3); pointer-events: auto; cursor: move; }
.frame.editing iframe { pointer-events: auto; }
.frame.editing { outline: calc(2px / var(--z, 1)) solid var(--accent); }

/* ── the floating toolbar ── */
#float {
  position: fixed; z-index: 14; display: none; align-items: center; gap: 2px; padding: 3px;
  background: var(--panel); border-radius: var(--r); box-shadow: var(--chrome-shadow), var(--edge);
}
#float.open { display: flex; }
/* An open comment thread has the screen: the toolbar comes back when it closes. */
body:has(#thread.open) #float.open, body:has(#thread.open) #itembar.open { display: none; }
/* Never wider than the window: on a phone the bar scrolls sideways under a finger instead of running off the edge. */
#float { max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; }
#float::-webkit-scrollbar { display: none; }
/* When it scrolls sideways (a narrow screen), a soft light edge shows on each side that has more of it: the panel
   color scrolls with the tools and covers the edge once the end is reached. */
#float {
  background:
    linear-gradient(to right, var(--panel) 40%, transparent) left / 32px 100% no-repeat local,
    linear-gradient(to left, var(--panel) 40%, transparent) right / 32px 100% no-repeat local,
    linear-gradient(to right, color-mix(in srgb, var(--ink) 28%, transparent), transparent) left / 16px 100% no-repeat scroll,
    linear-gradient(to left, color-mix(in srgb, var(--ink) 28%, transparent), transparent) right / 16px 100% no-repeat scroll,
    var(--panel);
}
#float > * { flex: none; }
@media (max-width: 640px) { #float .fbtn.wide { max-width: 112px; } }
.fbtn {
  height: 30px; min-width: 30px; padding: 0 7px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; position: relative; cursor: pointer;
}
.fbtn:hover { background: var(--panel-2); color: var(--ink); }
.fbtn[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
.fbtn.cta { background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 14px; border-radius: 999px; }
.fbtn.cta:hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.12); }
.fbtn.wide { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; justify-content: space-between; }
.fbtn .caret { margin-left: 2px; }
.swatch-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.swatch-btn .chip { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); }
.align-glyph { display: inline-grid; gap: 2px; width: 14px; }
.align-glyph i { display: block; height: 2px; background: currentColor; border-radius: 1px; }
.align-glyph i:nth-child(2) { width: 70%; }
.align-glyph[data-a='center'] { justify-items: center; }
.align-glyph[data-a='right'] { justify-items: end; }
.align-glyph[data-a='justify'] i { width: 100%; }

/* ── the panel's insides ── */
#panel .empty { color: var(--ink-3); padding: 16px 12px; }
#panel .note { margin: 8px 12px; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); color: var(--ink-2); font-size: 12px; }
#panel .tab-body > .layers { flex: none; height: 38%; min-height: 120px; display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
#panel .tab-body > .layers:empty { display: none; }
#panel .tab-body > #props, #panel .tab-body > #code { flex: 1; min-height: 0; overflow: auto; }
.lhead { flex: none; padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
.lhead .lsearch { flex: 1; min-width: 0; height: 24px; padding: 2px 8px; border: 1px solid transparent; border-radius: 6px; background: var(--panel-2); color: var(--ink); font: 12px system-ui, sans-serif; text-transform: none; letter-spacing: 0; }
.lrow .lwhere { margin-left: auto; padding-left: 8px; color: var(--ink-3); font-size: 11px; flex: none; }
.lbody { flex: 1; min-height: 0; overflow: auto; padding: 0 4px 6px; }
.lbody > .lrow { flex: none; }
.lrow {
  display: flex; align-items: center; gap: 4px; width: 100%; border: 0; background: none; text-align: left; color: var(--ink-2);
  padding: 3px 6px 3px calc(6px + var(--d) * 12px); border-radius: 5px; font-size: 12px; min-height: 24px;
}
.lrow:hover { background: var(--panel-2); color: var(--ink); }
.lrow.on { background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--ink); }
.lrow.dragging { opacity: 0.4; }
.lrow .lname { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; }
.lrow .eye { margin-left: auto; flex: none; display: inline-flex; padding: 2px 4px; border-radius: 4px; color: var(--ink-2); visibility: hidden; }
.lrow .eye .ico { width: 14px; height: 14px; display: inline-flex; }
.lrow .eye:hover { color: var(--ink); background: var(--panel-2); }
.lrow:hover .eye, .lrow.hidden-layer .eye { visibility: visible; }
.lrow.hidden-layer .ln, .lrow.hidden-layer .lk { opacity: 0.45; }
.lrow.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.lrow.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.lrow.drop-inside { outline: 2px solid var(--accent); outline-offset: -2px; }
.lrow.lframe { font-weight: 600; color: var(--ink); }
.lrow.runtime .ln { font-style: italic; color: var(--ink-3); }
.lrow .tw { width: 12px; flex: none; color: var(--ink-3); font-size: 10px; text-align: center; }
.lrow .lk { width: 16px; flex: none; color: var(--ink-3); font-size: 11px; text-align: center; display: inline-flex; justify-content: center; }
.lrow .lk .ico, .lrow .lk svg { width: 12px; height: 12px; }
.lrow .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

#props, #code, #tweaks { padding-bottom: 24px; }
.ptitle, .ctitle { padding: 10px 12px 4px; font-weight: 600; overflow-wrap: anywhere; }
.ctitle .copy-css { float: right; margin-left: 8px; font-weight: 500; }
.ptitle small { font-weight: 400; color: var(--ink-3); }
.alignrow { display: flex; gap: 2px; padding: 4px 12px 8px; }
.ag { display: inline-block; width: 14px; height: 14px; position: relative; }
.ag::before { content: ''; position: absolute; background: currentColor; }
.ag::after { content: ''; position: absolute; background: currentColor; opacity: 0.5; }
.ag[data-a^='h-']::before { top: 0; bottom: 0; width: 1.5px; }
.ag[data-a^='h-']::after { top: 4px; height: 6px; width: 8px; }
.ag[data-a='h-left']::before { left: 0; } .ag[data-a='h-left']::after { left: 3px; }
.ag[data-a='h-center']::before { left: 6px; } .ag[data-a='h-center']::after { left: 3px; }
.ag[data-a='h-right']::before { right: 0; } .ag[data-a='h-right']::after { right: 3px; }
.ag[data-a^='v-']::before { left: 0; right: 0; height: 1.5px; }
.ag[data-a^='v-']::after { left: 4px; width: 6px; height: 8px; }
.ag[data-a='v-top']::before { top: 0; } .ag[data-a='v-top']::after { top: 3px; }
.ag[data-a='v-middle']::before { top: 6px; } .ag[data-a='v-middle']::after { top: 3px; }
.ag[data-a='v-bottom']::before { bottom: 0; } .ag[data-a='v-bottom']::after { bottom: 3px; }
.psec { border-top: 1px solid var(--line); padding: 6px 12px 10px; }
.psec > header { display: flex; align-items: center; justify-content: space-between; height: 28px; }
.psec > header b { font-size: 12px; }
.pf { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 6px; margin: 4px 0; }
.pf > label { color: var(--ink-3); font-size: 12px; }
.pf > label.scrub { cursor: ew-resize; user-select: none; touch-action: none; }
.pc { display: flex; gap: 4px; align-items: center; min-width: 0; flex-wrap: wrap; }
.pc .cap { display: grid; gap: 1px; flex: 1; min-width: 0; }
.pc .cap input { width: 100%; }
.pc .cap small { font-size: 10px; color: var(--ink-3); text-align: center; }
#panel input:not([type]), #panel input[type='text'], #panel input[list], #panel select, #panel .pc input.n, #panel textarea {
  min-width: 0; background: var(--panel-2); border: 1px solid transparent; border-radius: var(--r-sm); padding: 3px 8px; height: 28px; color: var(--ink);
}
#panel .pc > input:not([type]) { flex: 1 1 0; min-width: 48px; }
#panel input.n { width: 54px; flex: none !important; font-variant-numeric: tabular-nums; }
#panel input.n.s { width: 44px; }
#panel select { flex: 1; }
#panel .export-btn { display: block; width: 100%; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panel input[type='range'] { flex: 1; accent-color: var(--accent); }
#panel input:disabled, #panel select:disabled, #panel button:disabled { opacity: 0.45; }
.val { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12px; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 6px; padding: 2px; gap: 1px; }
.seg button { border: 0; background: none; color: var(--ink-3); border-radius: 4px; padding: 0 6px; height: 22px; font-size: 11px; min-width: 22px; }
.seg button[aria-pressed='true'] { background: var(--panel-3); color: var(--ink); }
.mini { border: 0; background: none; color: var(--ink-3); border-radius: 5px; min-width: 20px; height: 24px; padding: 0 4px; }
.mini:hover { background: var(--panel-2); color: var(--ink); }
.nine { display: grid; grid-template-columns: repeat(3, 14px); gap: 3px; background: var(--panel-2); padding: 4px; border-radius: 6px; }
.nine button { width: 14px; height: 14px; border: 0; border-radius: 3px; background: var(--panel-3); padding: 0; }
.nine button[aria-pressed='true'] { background: var(--accent); }
.colorf { display: flex; gap: 4px; align-items: center; flex: 1 1 0; min-width: 0; position: relative; }
.colorf .swatches { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: 208px; padding: 8px; display: grid; gap: 6px; background: var(--panel, #1c1c22); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.35), 0 0 0 1px rgb(255 255 255 / 0.08); }
.colorf .swatches.up { top: auto; bottom: calc(100% + 4px); }
.colorf .swatches small { font-size: 11px; color: var(--ink-3); }
.colorf .swatches .swrow { display: flex; flex-wrap: wrap; gap: 4px; }
.colorf .swatches .sw { width: 20px; height: 20px; padding: 0; border-radius: 4px; border: 1px solid rgb(128 128 128 / 0.45); cursor: pointer; }
.colorf .swatches .sw:hover { outline: 2px solid var(--accent, #3b82f6); outline-offset: 1px; }
/* Every color field is a round swatch of its color, not the browser's gray box. */
#panel input[type='color'] { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: none; flex: none; cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
#panel input[type='color']::-webkit-color-swatch-wrapper { padding: 0; }
#panel input[type='color']::-webkit-color-swatch { border: 0; border-radius: 50%; }
#panel input[type='color']::-moz-color-swatch { border: 0; border-radius: 50%; }
#panel .colorf input:not([type]) { flex: 1; width: 0; min-width: 60px; padding: 3px 6px; }
.colorf .alpha { font-size: 11px; color: var(--ink-3); flex: none; }
/* No color set: an empty swatch crossed by a line, as Figma shows none. */
#panel input[type='color'].clear::-webkit-color-swatch { background: linear-gradient(135deg, transparent 46%, #e5484d 46% 54%, transparent 54%) !important; }
#panel input[type='color'].clear::-moz-color-swatch { background: linear-gradient(135deg, transparent 46%, #e5484d 46% 54%, transparent 54%) !important; }
.contrast { margin: 0 0 4px 84px; font-size: 11px; }
.contrast.ok { color: #7ee2a8; } .contrast.mid { color: #f5c26b; } .contrast.bad { color: var(--danger); }
.wraps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chipbtn { border: 1px solid var(--line); background: none; color: var(--ink-2); border-radius: 999px; padding: 2px 10px; font-size: 11px; }
.chipbtn:hover { color: var(--ink); border-color: var(--ink-3); }
.chead { padding: 10px 12px 4px; font-size: 11px; color: var(--ink-3); font-weight: 600; overflow-wrap: anywhere; }
.decl { display: grid; grid-template-columns: minmax(80px, 40%) 1fr auto; gap: 4px; padding: 1px 12px; align-items: center; font: 12px/1.4 ui-monospace, 'Cascadia Code', Consolas, monospace; }
