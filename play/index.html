; }\n  hr { border: 0; border-top: 1px solid #e3e1da; margin: 0 0 32px; }\n  h2.try { font-size: 28px; margin: 0 0 6px; }\n  .cols { columns: 2; column-gap: 48px; }\n  section { break-inside: avoid; margin: 0 0 28px; }\n  h3 { font-size: 18px; margin: 0 0 8px; }\n  label { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; cursor: pointer; }\n  input { margin-top: 5px; flex: none; }\n  label:has(input:checked) span { color: #8a8c99; text-decoration: line-through; }\n  kbd { font: 13px ui-monospace, Consolas, monospace; background: #ecebe6; border-radius: 4px; padding: 0 5px; }\n  code { font: 14px ui-monospace, Consolas, monospace; }\n  .count { color: #5b5d6b; font-size: 14px; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cmain\u003e\n  \u003ch1\u003eDesign canvas\u003c/h1\u003e\n  \u003cp class=\"lead\"\u003eSee every HTML prototype in a folder on one board. Click through them, change their text, styles and layout right where they are, comment on them and sketch around them. Every edit is saved back into the prototype's own \u003ccode\u003e.html\u003c/code\u003e file. All it needs is Node.\u003c/p\u003e\n  \u003cdiv class=\"get\"\u003e\n    \u003ca class=\"btn\" href=\"https://github.com/ryanallen/design-canvas/archive/refs/heads/main.zip\" target=\"_blank\" rel=\"noopener\"\u003e⬇ Download it\u003c/a\u003e\n    \u003ca class=\"btn star\" href=\"https://github.com/ryanallen/design-canvas\" target=\"_blank\" rel=\"noopener\"\u003e★ Star on GitHub\u003c/a\u003e\n    \u003ca class=\"btn quiet\" href=\"https://github.com/ryanallen/design-canvas\" target=\"_blank\" rel=\"noopener\"\u003eView the code\u003c/a\u003e\n  \u003c/div\u003e\n  \u003cpre\u003egit clone https://github.com/ryanallen/design-canvas .agents/skills/design-canvas\nnode .agents/skills/design-canvas/scripts/canvas.mjs build &lt;folder of prototypes&gt;\u003c/pre\u003e\n  \u003cp class=\"small\"\u003ePut it in your project's \u003ccode\u003e.agents/skills/design-canvas/\u003c/code\u003e folder (or \u003ccode\u003e.claude/skills/design-canvas/\u003c/code\u003e), and your AI agent will read \u003ccode\u003eSKILL.md\u003c/code\u003e. No terminal? Double-click \u003cb\u003eDesign Canvas.cmd\u003c/b\u003e on Windows or \u003cb\u003eDesign Canvas.command\u003c/b\u003e on a Mac and pick a folder.\u003c/p\u003e\n  \u003chr\u003e\n  \u003ch2 class=\"try\"\u003eTry it on this board\u003c/h2\u003e\n  \u003cp class=\"lead\"\u003eEverything you do here is saved in your browser, just for you. Things with an orange dot or a padlock are locked, and everything else is yours to change. Tick each box as you try it. \u003cspan class=\"count\" id=\"count\"\u003e\u003c/span\u003e\u003c/p\u003e\n  \u003cdiv class=\"cols\"\u003e\n    \u003csection\u003e\n      \u003ch3\u003e1. The board\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eScroll to move around. \u003ckbd\u003eCtrl\u003c/kbd\u003e and scroll to zoom. \u003ckbd\u003eF\u003c/kbd\u003e fits everything in view, and holding \u003ckbd\u003eSpace\u003c/kbd\u003e lets you drag the board.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eUse the zoom menu at the top right to jump to 50%, 100% or 200%.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eDrag a screen by its name to move it. Reload, and it stays where you put it. (This one is locked, so try another.)\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eUse Pages at the top left to add a page, rename it and delete it.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e2. Select\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eLinks, buttons and fields work when you click them. \u003ckbd\u003eCtrl\u003c/kbd\u003e+click (or \u003ckbd\u003e⌘\u003c/kbd\u003e+click) one to select it instead.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eHover over something to see its outline. Click to select it, and you'll see its name and handles.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eClick one card on \u003cb\u003ehome\u003c/b\u003e and only that card is selected. \u003ckbd\u003eAlt\u003c/kbd\u003e+click to select all three.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e\u003ckbd\u003eEsc\u003c/kbd\u003e selects the parent, \u003ckbd\u003eEnter\u003c/kbd\u003e selects what's inside, and \u003ckbd\u003eTab\u003c/kbd\u003e moves to the next one.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e\u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003e\\\u003c/kbd\u003e opens the side panel. Its layer list follows what you select, and the other way round.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e3. Text\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eDouble-click the headline on \u003cb\u003ehome\u003c/b\u003e, type something new and press \u003ckbd\u003eEnter\u003c/kbd\u003e.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eWhile typing, select a word and press \u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eB\u003c/kbd\u003e to make it bold, or give it a color from the toolbar.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003ePress \u003ckbd\u003eT\u003c/kbd\u003e and click inside a screen to start a new paragraph.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e4. Style\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eTry the toolbar above a selection: color, bold, alignment, fill, layout, corner radius and padding.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eIn Properties, set width to Hug, Fixed or Fill, and change padding and font size. Colors show how readable they are.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eSelect all three cards and change the corner radius. One rule changes them all.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eIn the Code tab, change a style, an \u003ccode\u003e@attribute\u003c/code\u003e and the HTML itself, then press Apply.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eOpen Tweaks on \u003cb\u003ehome\u003c/b\u003e, drag \u003ccode\u003e--gap\u003c/code\u003e and pick a new \u003ccode\u003e--accent\u003c/code\u003e.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e5. Structure\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eDrag a card in front of another. A blue line shows where it will land.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eDrag the right handle of a selection to resize it.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eTry \u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eD\u003c/kbd\u003e to duplicate, \u003ckbd\u003eDelete\u003c/kbd\u003e, \u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eG\u003c/kbd\u003e to wrap and \u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eShift\u003c/kbd\u003e+\u003ckbd\u003eG\u003c/kbd\u003e to unwrap, and \u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eC\u003c/kbd\u003e then \u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eV\u003c/kbd\u003e.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e\u003ckbd\u003eAlt\u003c/kbd\u003e+\u003ckbd\u003e↓\u003c/kbd\u003e moves it down one place. The … menu can wrap it in a row, a column or a grid.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e\u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eZ\u003c/kbd\u003e undoes each change, and \u003ckbd\u003eCtrl\u003c/kbd\u003e+\u003ckbd\u003eShift\u003c/kbd\u003e+\u003ckbd\u003eZ\u003c/kbd\u003e redoes it.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e6. Comments\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003ePress \u003ckbd\u003eC\u003c/kbd\u003e and click something to comment on it. Reply, resolve and delete from there.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eMove that element, and its comment pin moves with it.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eSelect something, click \u003cb\u003e✦ Ask agent\u003c/b\u003e at the bottom, type a request and press \u003ckbd\u003eEnter\u003c/kbd\u003e. An orange pin appears. In your own copy, your AI agent picks it up as a task.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e7. On the board\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e\u003ckbd\u003eN\u003c/kbd\u003e makes a sticky note to type in and recolor. \u003ckbd\u003eR\u003c/kbd\u003e draws a rectangle, \u003ckbd\u003eO\u003c/kbd\u003e an ellipse, \u003ckbd\u003eL\u003c/kbd\u003e a line and \u003ckbd\u003eShift\u003c/kbd\u003e+\u003ckbd\u003eL\u003c/kbd\u003e an arrow.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eDraw an arrow from a note to a screen, then move the screen. The arrow stays attached.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e\u003ckbd\u003eP\u003c/kbd\u003e draws with a pencil. \u003ckbd\u003eT\u003c/kbd\u003e on the empty board adds a title.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eDrag a box around some notes and screens, then move them all together.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003ePress \u003ckbd\u003eA\u003c/kbd\u003e and drag out a new screen. It's a new prototype, ready to edit.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e8. Play\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003ePress ▷ PLAY on \u003cb\u003ehome\u003c/b\u003e and click \u003cb\u003eDownload free\u003c/b\u003e. It takes you to \u003cb\u003edetail\u003c/b\u003e.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003e\u003ckbd\u003e←\u003c/kbd\u003e and \u003ckbd\u003e→\u003c/kbd\u003e go through the screens. Try the 390, 1024, 1440, Fill and Fit sizes, then \u003ckbd\u003eEsc\u003c/kbd\u003e to go back.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eOpen \u003cb\u003epricing\u003c/b\u003e full screen. It reflows to fit the window.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n    \u003csection\u003e\n      \u003ch3\u003e9. It all stays\u003c/h3\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eReload the page. Every edit, comment, note and page is still there.\u003c/span\u003e\u003c/label\u003e\n      \u003clabel\u003e\u003cinput type=\"checkbox\"\u003e\u003cspan\u003eFrom the title menu, download the whole canvas, and then just one prototype.\u003c/span\u003e\u003c/label\u003e\n    \u003c/section\u003e\n  \u003c/div\u003e\n\u003c/main\u003e\n\u003cscript\u003e\n  const boxes = [...document.querySelectorAll('input[type=checkbox]')]\n  const key = 'design-canvas-site'\n  let saved = []\n  try { saved = JSON.parse(localStorage.getItem(key)) || [] } catch {}\n  boxes.forEach((b, i) =\u003e { b.checked = !!saved[i] })\n  const count = () =\u003e { document.getElementById('count').textContent = `${boxes.filter((b) =\u003e b.checked).length} of ${boxes.length} done.` }\n  for (const b of boxes) b.addEventListener('change', () =\u003e {\n    try { localStorage.setItem(key, JSON.stringify(boxes.map((x) =\u003e x.checked))) } catch {}\n    count()\n  })\n  count()\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","home.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003cmeta name=\"canvas-levers\" content=\"--accent, --gap\"\u003e\n\u003ctitle\u003eTidewater: home\u003c/title\u003e\n\u003cstyle\u003e\n  :root { --accent: #0e6e6e; --gap: 24px; --ink: #14202b; }\n  body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: #f7f5f0; }\n  .top { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; }\n  .brand { font-weight: 700; font-size: 20px; }\n  .nav { display: flex; gap: 24px; }\n  .nav a { color: inherit; text-decoration: none; }\n  .hero { padding: 96px 48px 64px; max-width: 760px; }\n  .hero h1 { font-size: 56px; line-height: 1.05; margin: 0 0 16px; }\n  .hero p { font-size: 19px; line-height: 1.5; color: #4a5560; margin: 0 0 28px; }\n  .btn { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }\n  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); padding: 0 48px 96px; }\n  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }\n  .card h3 { margin: 0 0 8px; font-size: 18px; }\n  .card p { margin: 0; color: #4a5560; line-height: 1.5; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader data-locked=\"true\" class=\"top\"\u003e\n  \u003cdiv class=\"brand\"\u003eTidewater\u003c/div\u003e\n  \u003cnav class=\"nav\"\u003e\u003ca href=\"#tides\"\u003eTides\u003c/a\u003e\u003ca href=\"detail.html\"\u003eSpots\u003c/a\u003e\u003ca href=\"#about\"\u003eAbout\u003c/a\u003e\u003c/nav\u003e\n\u003c/header\u003e\n\u003csection class=\"hero\" id=\"hero\"\u003e\n  \u003ch1\u003eKnow when to paddle out.\u003c/h1\u003e\n  \u003cp\u003eTides, swell and wind for every break near you, in one glance.\u003c/p\u003e\n  \u003ca class=\"btn\" href=\"detail.html\"\u003eDownload free\u003c/a\u003e\n\u003c/section\u003e\n\u003csection class=\"cards\" id=\"tides\"\u003e\n  \u003cdiv class=\"card\"\u003e\u003ch3\u003eTides\u003c/h3\u003e\u003cp\u003eHigh and low for the week, to the minute.\u003c/p\u003e\u003c/div\u003e\n  \u003cdiv class=\"card\"\u003e\u003ch3\u003eSwell\u003c/h3\u003e\u003cp\u003eHeight, period and direction from three models.\u003c/p\u003e\u003c/div\u003e\n  \u003cdiv class=\"card\"\u003e\u003ch3\u003eWind\u003c/h3\u003e\u003cp\u003eOffshore or onshore, hour by hour.\u003c/p\u003e\u003c/div\u003e\n\u003c/section\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","detail.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003ctitle\u003eTidewater: a spot\u003c/title\u003e\n\u003cstyle\u003e\n  body { margin: 0; font-family: system-ui, sans-serif; color: #14202b; background: #fff; }\n  .bar { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid #e5e7eb; }\n  .bar a { color: #0e6e6e; text-decoration: none; font-weight: 600; }\n  main { padding: 32px 24px; max-width: 720px; }\n  h1 { margin: 0 0 8px; font-size: 36px; }\n  .tabs { display: flex; gap: 8px; margin: 24px 0; }\n  .tab { border: 1px solid #d1d5db; background: #fff; border-radius: 999px; padding: 8px 16px; font: inherit; cursor: pointer; }\n  .tab.on { background: #14202b; color: #fff; border-color: #14202b; }\n  .panel { display: none; line-height: 1.6; }\n  .panel.on { display: block; }\n  table { border-collapse: collapse; width: 100%; }\n  td { border-bottom: 1px solid #eee; padding: 8px 0; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"bar\"\u003e\u003ca href=\"home.html\"\u003e‹ Home\u003c/a\u003e\u003cspan\u003eMalibu, First Point\u003c/span\u003e\u003c/div\u003e\n\u003cmain\u003e\n  \u003ch1\u003eFirst Point\u003c/h1\u003e\n  \u003cp\u003eA long right-hand point break that likes a south swell.\u003c/p\u003e\n  \u003cdiv class=\"tabs\"\u003e\u003cbutton class=\"tab on\" data-for=\"today\"\u003eToday\u003c/button\u003e\u003cbutton class=\"tab\" data-for=\"week\"\u003eThis week\u003c/button\u003e\u003c/div\u003e\n  \u003cdiv class=\"panel on\" id=\"today\"\u003e\n    \u003ctable\u003e\n      \u003ctr\u003e\u003ctd\u003eHigh tide\u003c/td\u003e\u003ctd\u003e6:42 am\u003c/td\u003e\u003c/tr\u003e\n      \u003ctr\u003e\u003ctd\u003eLow tide\u003c/td\u003e\u003ctd\u003e12:58 pm\u003c/td\u003e\u003c/tr\u003e\n      \u003ctr\u003e\u003ctd\u003eSwell\u003c/td\u003e\u003ctd\u003e3–4 ft at 14 s\u003c/td\u003e\u003c/tr\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"panel\" id=\"week\"\u003e\u003cp\u003eThe swell builds through Thursday, then fades.\u003c/p\u003e\u003c/div\u003e\n\u003c/main\u003e\n\u003cscript\u003e\n  for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () =\u003e {\n    for (const x of document.querySelectorAll('.tab, .panel')) x.classList.remove('on')\n    b.classList.add('on')\n    document.getElementById(b.dataset.for).classList.add('on')\n  })\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","pricing.html":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003cmeta name=\"canvas-fluid\"\u003e\n\u003ctitle\u003eTidewater: pricing\u003c/title\u003e\n\u003cstyle\u003e\n  body { margin: 0; font-family: system-ui, sans-serif; color: #14202b; background: #0f1b24; }\n  .wrap { padding: 72px 6vw; }\n  h2 { color: #fff; font-size: 40px; margin: 0 0 32px; }\n  .plans { display: flex; flex-wrap: wrap; gap: 20px; }\n  .plan { flex: 1 1 260px; background: #fff; border-radius: 18px; padding: 28px; }\n  .plan b { display: block; font-size: 32px; margin: 8px 0 16px; }\n  .plan ul { margin: 0; padding-left: 18px; line-height: 1.8; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"wrap\"\u003e\n  \u003ch2\u003ePick a plan\u003c/h2\u003e\n  \u003cdiv class=\"plans\"\u003e\n    \u003cdiv class=\"plan\"\u003e\u003cspan\u003eFree\u003c/span\u003e\u003cb\u003e$0\u003c/b\u003e\u003cul\u003e\u003cli\u003eOne spot\u003c/li\u003e\u003cli\u003eToday only\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n    \u003cdiv class=\"plan\"\u003e\u003cspan\u003eLocal\u003c/span\u003e\u003cb\u003e$4\u003c/b\u003e\u003cul\u003e\u003cli\u003eFive spots\u003c/li\u003e\u003cli\u003eThe week ahead\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n    \u003cdiv class=\"plan\"\u003e\u003cspan\u003eTravel\u003c/span\u003e\u003cb\u003e$9\u003c/b\u003e\u003cul\u003e\u003cli\u003eEvery spot\u003c/li\u003e\u003cli\u003eAlerts\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},"meta":{"start-here.html":{"levers":[],"fluid":false,"play":true},"home.html":{"levers":["--accent","--gap"],"fluid":false,"play":true},"detail.html":{"levers":[],"fluid":false,"play":true},"pricing.html":{"levers":[],"fluid":true,"play":false}},"assets":{},"crop":"function cropToOption(letter) {\n  const marks = []\n  for (const el of document.querySelectorAll('[data-option]')) marks.push([el, el.getAttribute('data-option')])\n  if (!marks.length) for (const el of document.querySelectorAll('span.n')) if (/^[A-Z]$/.test(el.textContent.trim())) marks.push([el, el.textContent.trim()])\n  if (!marks.length) {\n    const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT)\n    while (walk.nextNode()) {\n      const m = /^\\s*Option ([A-Z])\\s*[—–:-]/.exec(walk.currentNode.data)\n      if (m) marks.push([walk.currentNode.parentElement, m[1]])\n    }\n  }\n  // A column is the biggest box round a mark that holds no other option's mark.\n  const cols = new Map()\n  for (const [el, l] of marks) {\n    let e = el\n    while (e.parentElement && e.parentElement !== document.body && !marks.some(([m, ml]) =\u003e ml !== l && e.parentElement.contains(m))) e = e.parentElement\n    if (!cols.has(e)) cols.set(e, l)\n  }\n  // An option's part runs from its mark's box to the next marked box beside it, so a board that\n  // stacks its options under headings cuts the same way as one that sets them in columns.\n  const skip = /^(svg|style|script|template|link|meta)$/i\n  const hide = (el) =\u003e el.style.setProperty('display', 'none', 'important')\n  const parents = new Set([...cols.keys()].map((e) =\u003e e.parentElement))\n  const kept = []\n  for (const parent of parents) {\n    let cur = null\n    for (const child of parent.children) {\n      if (cols.has(child)) cur = cols.get(child)\n      if (skip.test(child.tagName)) continue\n      if (cur === letter) kept.push(child)\n      else hide(child)\n    }\n  }\n  if (!kept.length) return null\n  for (const parent of parents) {\n    for (let up = parent; up && up !== document.body; up = up.parentElement) {\n      for (const sib of up.parentElement.children) {\n        if (sib !== up && !skip.test(sib.tagName) && !kept.some((k) =\u003e sib.contains(k))) hide(sib)\n      }\n    }\n  }\n  const boxes = kept.map((k) =\u003e k.getBoundingClientRect()).filter((r) =\u003e r.width)\n  const left = Math.min(...boxes.map((r) =\u003e r.left))\n  const right = Math.max(...boxes.map((r) =\u003e r.right))\n  return { w: Math.ceil(right + Math.max(24, left)) }\n}","comments":null,"room":"wss://design-canvas-room.norml.workers.dev/room/play-yycLAnTKbZd3MdJ5","url":"https://ryanallen.com/design-canvas/play/","play":true,"links":[{"text":"About","href":"https://ryanallen.com/design-canvas/"},{"text":"⬇ Download","href":"https://github.com/ryanallen/design-canvas/archive/refs/heads/main.zip"},{"text":"★ Star","href":"https://github.com/ryanallen/design-canvas"},{"text":"How to install","href":"https://github.com/ryanallen/design-canvas#install"}],"serve":false}</script>
<script>

const CANVAS_MARK = 'review-canvas'
const EVENT_PREFIX = 'comment '
const LIMITS = { name: 80, text: 4000, frame: 240, events: 5000 }
const OPS = ['add', 'reply', 'resolve', 'delete', 'agent', 'edit', 'react', 'place']
const KINDS = ['comment', 'edit', 'board']
/** The emoji a comment can be reacted to with. */
const REACTIONS = ['👍', '❤️', '🎉', '👀', '✅']

/** One event as the line that stores it. `--` only ever occurs inside a JSON string, so writing
 * the second dash as `-` keeps the JSON identical and the HTML comment unbroken. */
function eventLine(event, kind = 'comment') {
  return `<\!-- ${kind} ${JSON.stringify(event).replace(/--/g, '-\\u002d')} -->`
}

/** Every comment event stored in an HTML document, in file order. A line that is not a valid
 * event is skipped, never fatal: one bad hand edit must not hide every other comment. */
function parseEvents(html) {
  return parseLines(html, 'comment').filter((e) => OPS.includes(e.op))
}

/** Every event of one kind, in file order. */
function parseLines(html, kind) {
  const events = []
  const re = new RegExp(`<\\!-- ${kind} (\\{.*?\\}) -->`, 'g')
  for (const m of html.matchAll(re)) {
    try {
      const event = JSON.parse(m[1])
      if (event && typeof event.op === 'string') events.push(event)
    } catch {}
  }
  return events
}

/** Every stored line of any kind, as written, in file order. */
function storedLines(html) {
  const re = new RegExp(`^<\\!-- (?:${KINDS.join('|')}) \\{.*\\} -->$`)
  return html.split('\n').map((l) => l.trim()).filter((l) => re.test(l))
}

/** The document with one more event line, written before the last `</body>`. */
function insertEvent(html, event, kind = 'comment') {
  const line = `${eventLine(event, kind)}\n`
  const at = html.lastIndexOf('</body>')
  return at < 0 ? `${html}\n${line}` : `${html.slice(0, at)}${line}${html.slice(at)}`
}

const text = (value, max, field) => {
  if (typeof value !== 'string') throw new Error(`${field} is required`)
  const clean = value.replace(/\r\n?/g, '\n').trim()
  if (!clean) throw new Error(`${field} is required`)
  if (clean.length > max) throw new Error(`${field} is longer than ${max} characters`)
  return clean
}
const id = (value, field) => {
  if (typeof value !== 'string' || !/^[a-z]-[a-z0-9]{6,24}$/.test(value)) throw new Error(`${field} is not an id`)
  return value
}
const coord = (value, field) => {
  if (typeof value !== 'number' || !Number.isFinite(value) || Math.abs(value) > 1e6) throw new Error(`${field} is not a number`)
  return Math.round(value)
}
const anchorOf = (a) => {
  if (!a || typeof a !== 'object') return undefined
  const path = typeof a.path === 'string' ? a.path.slice(0, 600) : null
  if (!path) return undefined
  const out = { path, dx: coord(a.dx ?? 0, 'anchor.dx'), dy: coord(a.dy ?? 0, 'anchor.dy') }
  if (typeof a.tag === 'string' && /^[a-z][a-z0-9-]{0,30}$/.test(a.tag)) out.tag = a.tag
  if (typeof a.text === 'string' && a.text.trim()) out.text = a.text.slice(0, 80)
  return out
}

const boxOf = (b) => {
  if (!b || typeof b !== 'object') return undefined
  return { x: coord(b.x, 'box.x'), y: coord(b.y, 'box.y'), w: Math.max(0, coord(b.w, 'box.w')), h: Math.max(0, coord(b.h, 'box.h')) }
}
const refsOf = (list, field) => {
  if (list == null) return undefined
  if (!Array.isArray(list) || list.length > 400) throw new Error(`${field} is not a list`)
  return list.map((v, i) => text(v, LIMITS.frame, `${field}[${i}]`))
}

/** What a client sent, checked and stamped. The server gives the id and the time, so neither
 * can be forged into an order the file did not see. */
function makeEvent(input, { now = new Date(), newId = randomId } = {}) {
  if (!input || typeof input !== 'object') throw new Error('event is required')
  const at = now.toISOString()
  const name = text(input.name, LIMITS.name, 'name')
  switch (input.op) {
    case 'add': {
      const frame = input.frame == null ? null : text(input.frame, LIMITS.frame, 'frame')
      const event = { op: 'add', id: newId('c'), at, name, text: text(input.text, LIMITS.text, 'text'), frame, x: coord(input.x, 'x'), y: coord(input.y, 'y') }
      const anchor = anchorOf(input.anchor)
      if (anchor) Object.assign(event, { file: text(input.file ?? (frame ?? '').split('#')[0], LIMITS.frame, 'file'), anchor })
      if (input.agent) event.agent = true
      const box = boxOf(input.box)
      if (box) event.box = box
      const about = refsOf(input.items, 'items')
      if (about?.length) event.items = about
      if (frame == null) {
        if (input.page != null) event.page = text(input.page, LIMITS.frame, 'page')
        if (input.item != null) Object.assign(event, { item: text(input.item, LIMITS.frame, 'item'), dx: coord(input.dx ?? 0, 'dx'), dy: coord(input.dy ?? 0, 'dy') })
      }
      return event
    }
    case 'reply':
      return { op: 'reply', id: newId('r'), to: id(input.to, 'to'), at, name, text: text(input.text, LIMITS.text, 'text') }
    case 'resolve':
      return { op: 'resolve', to: id(input.to, 'to'), at, name, resolved: input.resolved !== false }
    case 'delete':
      return { op: 'delete', to: id(input.to, 'to'), at, name }
    case 'agent':
      return { op: 'agent', to: id(input.to, 'to'), at, name, agent: input.agent !== false }
    case 'react': {
      if (!REACTIONS.includes(input.emoji)) throw new Error(`emoji must be one of ${REACTIONS.join(' ')}`)
      return { op: 'react', to: id(input.to, 'to'), at, name, emoji: input.emoji, on: input.on !== false }
    }
    case 'place': {
      const frame = input.frame == null ? null : text(input.frame, LIMITS.frame, 'frame')
      const event = { op: 'place', to: id(input.to, 'to'), at, name, frame, x: coord(input.x, 'x'), y: coord(input.y, 'y') }
      const anchor = anchorOf(input.anchor)
      if (anchor) Object.assign(event, { file: text(input.file ?? (frame ?? '').split('#')[0], LIMITS.frame, 'file'), anchor })
      if (frame == null) {
        if (input.page != null) event.page = text(input.page, LIMITS.frame, 'page')
        if (input.item != null) Object.assign(event, { item: text(input.item, LIMITS.frame, 'item'), dx: coord(input.dx ?? 0, 'dx'), dy: coord(input.dy ?? 0, 'dy') })
      }
      return event
    }
    case 'edit':
      return { op: 'edit', to: id(input.to, 'to'), at, name, text: text(input.text, LIMITS.text, 'text') }
    default:
      throw new Error('op must be add, reply, resolve, delete, agent, edit, react or place')
  }
}

function randomId(prefix) {
  const bytes = new Uint8Array(9)
  globalThis.crypto.getRandomValues(bytes)
  return `${prefix}-${Array.from(bytes, (b) => (b % 36).toString(36)).join('')}`
}

/** The threads the events describe, oldest first. */
function foldEvents(events) {
  const threads = new Map()
  const owner = new Map()
  for (const e of events) {
    if (e.op === 'add' && !threads.has(e.id)) {
      threads.set(e.id, { id: e.id, at: e.at, name: e.name, text: e.text, frame: e.frame ?? null, x: e.x, y: e.y, file: e.file ?? null, anchor: e.anchor ?? null, box: e.box ?? null, items: e.items ?? [], page: e.page ?? null, item: e.item ?? null, dx: e.dx ?? 0, dy: e.dy ?? 0, agent: !!e.agent, resolved: false, resolvedBy: null, replies: [] })
    } else if (e.op === 'reply' && threads.has(e.to)) {
      threads.get(e.to).replies.push({ id: e.id, at: e.at, name: e.name, text: e.text })
      owner.set(e.id, e.to)
    } else if (e.op === 'resolve' && threads.has(e.to)) {
      const t = threads.get(e.to)
      t.resolved = e.resolved !== false
      t.resolvedBy = t.resolved ? e.name : null
    } else if (e.op === 'agent' && threads.has(e.to)) {
      threads.get(e.to).agent = e.agent !== false
    } else if (e.op === 'react') {
      const m = threads.get(e.to) ?? threads.get(owner.get(e.to))?.replies.find((r) => r.id === e.to)
      if (m) {
        const who = new Set(m.reactions?.[e.emoji] ?? [])
        e.on === false ? who.delete(e.name) : who.add(e.name)
        m.reactions = { ...(m.reactions ?? {}), [e.emoji]: [...who] }
        if (!who.size) delete m.reactions[e.emoji]
      }
    } else if (e.op === 'edit') {
      const m = threads.get(e.to) ?? threads.get(owner.get(e.to))?.replies.find((r) => r.id === e.to)
      if (m && m.name === e.name) Object.assign(m, { text: e.text, edited: e.at })
    } else if (e.op === 'place') {
      const t = threads.get(e.to)
      if (t && t.name === e.name) Object.assign(t, { frame: e.frame ?? null, x: e.x, y: e.y, file: e.file ?? null, anchor: e.anchor ?? null, page: e.page ?? null, item: e.item ?? null, dx: e.dx ?? 0, dy: e.dy ?? 0 })
    } else if (e.op === 'delete') {
      if (threads.has(e.to)) threads.delete(e.to)
      else if (owner.has(e.to)) {
        const t = threads.get(owner.get(e.to))
        if (t) t.replies = t.replies.filter((r) => r.id !== e.to)
      }
    }
  }
  return [...threads.values()]
}

/** The board's own objects, the frames moved by hand, the pages and the canvas's name; last line wins. */
function foldBoard(events) {
  const items = new Map()
  const moved = new Map()
  const pages = new Map()
  const locked = new Set()
  let name = null
  let voting = null
  for (const e of events) {
    if (e.op === 'move' && e.key) {
      const group = e.group != null ? e.group || null : moved.get(e.key)?.group ?? null
      moved.set(e.key, { x: e.x, y: e.y, page: e.page ?? moved.get(e.key)?.page ?? null, ...(group ? { group } : {}) })
    }
    else if (e.op === 'item' && e.id) items.set(e.id, { ...(items.get(e.id) ?? { by: e.name }), ...e })
    else if (e.op === 'remove' && e.id) items.delete(e.id)
    else if (e.op === 'page' && e.id) pages.set(e.id, { ...(pages.get(e.id) ?? { id: e.id }), ...(e.title != null ? { title: e.title } : {}), ...(e.removed != null ? { removed: e.removed } : {}), ...(e.order != null ? { order: e.order } : {}) })
    else if (e.op === 'name' && e.title) name = e.title
    else if (e.op === 'lock' && e.key) e.locked ? locked.add(e.key) : locked.delete(e.key)
    else if (e.op === 'vote') voting = e.on && e.id ? { id: e.id, votes: e.votes, by: e.name, at: e.at } : null
  }
  return { items: [...items.values()], moved: Object.fromEntries(moved), pages: [...pages.values()], name, locked: [...locked], voting }
}

/** A board object's color: a hex, a color name, or rgb()/hsl() numbers. Anything else is refused,
 * since the color is drawn into a style and an SVG. */
const colorOf = (value) => {
  const c = typeof value === 'string' ? value.trim() : ''
  if (c === '' || /^(#[0-9a-f]{3,8}|[a-z]{3,20}|(?:rgb|hsl)a?\([\d.,%\s/]+\))$/i.test(c)) return c
  throw new Error('color is not a color')
}
const BOARD_KINDS = ['note', 'title', 'rect', 'ellipse', 'diamond', 'triangle', 'stamp', 'section', 'line', 'arrow', 'pencil', 'guide', 'image']
/** An image on the board: a picture file in the canvas's folder, by its path there, never an address elsewhere. */
const imageSrc = (value) => {
  const s = typeof value === 'string' ? value.trim() : ''
  if (/^(?:[\w-]+\/)*[\w-][\w.-]{0,120}\.(?:png|jpe?g|gif|webp|avif|svg)$/i.test(s) && !s.includes('..')) return s
  throw new Error('src is not a picture in the folder')
}
const pageId = (value) => {
  if (typeof value !== 'string' || !/^[a-z0-9-]{1,40}$/.test(value)) throw new Error('page is not a page id')
  return value
}

/** A board event a client sent, checked and stamped. */
function makeBoardEvent(input, { now = new Date(), newId = randomId } = {}) {
  if (!input || typeof input !== 'object') throw new Error('event is required')
  const at = now.toISOString()
  const name = typeof input.name === 'string' && input.name.trim() ? input.name.trim().slice(0, LIMITS.name) : 'someone'
  switch (input.op) {
    case 'move': {
      const event = { op: 'move', at, name, key: text(input.key, LIMITS.frame, 'key'), x: coord(input.x, 'x'), y: coord(input.y, 'y') }
      if (input.page != null) event.page = pageId(input.page)
      if (input.group != null) event.group = input.group === '' ? '' : id(input.group, 'group')
      return event
    }
    case 'item': {
      const event = { op: 'item', id: input.id ? id(input.id, 'id') : newId('b'), at, name }
      if (input.kind != null) {
        if (!BOARD_KINDS.includes(input.kind)) throw new Error(`kind must be one of ${BOARD_KINDS.join(', ')}`)
        event.kind = input.kind
      }
      if (input.page != null) event.page = pageId(input.page)
      for (const k of ['x', 'y', 'w', 'h', 'z']) if (input[k] != null) event[k] = coord(input[k], k)
      for (const k of ['dx', 'dy']) if (input[k] != null) event[k] = coord(input[k], k)
      if (input.text != null) event.text = String(input.text).slice(0, LIMITS.text)
      if (input.color != null) event.color = colorOf(input.color)
      if (input.frame != null) event.frame = text(input.frame, LIMITS.frame, 'frame')
      if (input.src != null) event.src = imageSrc(input.src)
      for (const k of ['from', 'to']) if (input[k] != null) event[k] = input[k] === '' ? '' : text(input[k], LIMITS.frame, k)
      if (input.group != null) event.group = input.group === '' ? '' : id(input.group, 'group')
      for (const k of ['cols', 'gutter', 'margin']) if (input[k] != null) event[k] = input[k] === '' ? '' : coord(input[k], k)
      if (input.weight != null) event.weight = input.weight === '' ? '' : Math.min(60, Math.max(1, coord(input.weight, 'weight')))
      if (input.pen != null) {
        if (!['', 'highlight'].includes(input.pen)) throw new Error('pen must be highlight or empty')
        event.pen = input.pen
      }
      if (input.fill != null) {
        if (!['', 'solid'].includes(input.fill)) throw new Error('fill must be solid or empty')
        event.fill = input.fill
      }
      if (input.dash != null) {
        if (!['', 'dash'].includes(input.dash)) throw new Error('dash must be dash or empty')
        event.dash = input.dash
      }

    const go = `<style id="rc-screen">${rule}</style><script>document.addEventListener('click',(e)=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a||e.defaultPrevented)return;const href=a.getAttribute('href');if(href.startsWith('#')){e.preventDefault();const id=decodeURIComponent(href.slice(1));const t=id?document.getElementById(id):document.querySelector('.screen-page.is-start');if(!t)return;if(t.classList.contains('screen-page')){document.getElementById('rc-screen').textContent='.screen-page{display:none!important}#'+CSS.escape(t.id)+'{display:block!important}';scrollTo(0,0)}else t.scrollIntoView();return}if(/^[^:?]+\\.html(#.*)?$/i.test(href)){e.preventDefault();parent.postMessage({dc:'go',href},'*')}})<\/script>`

    // throws there and stops the prototype's handler half way; the state is kept and the address left as it is, and
    // pushState replaces, so a screen adds nothing to the canvas tab's Back. Its own Back (history.back, or go with a
    // step back) would take the canvas tab back, off the canvas: it is asked of the canvas instead, which in Play goes

      if (known) Object.assign(known, p.title ? { title: p.title } : {}, p.removed != null ? { removed: p.removed } : {}, p.order != null ? { order: p.order } : {})

  function layoutAll() {

  }

    for (const el of sectionEls) el.remove()

  /** A prototype's width on the board is its `<meta name="canvas-width">`, written into the file (one edit, so Ctrl+Z

  // A screen seen in its light or dark mode, as a Figma frame is set to a variable mode: its own
  // `prefers-color-scheme` rules are switched on or off for this screen alone, whatever this computer is set to.

          // (\`screen and (prefers-color-scheme: dark)\`) still reads.

  // ── pictures dropped or pasted onto the board ──

    const pics = [...files].filter((f) => PICTURE_TYPES.test(f.type))

    if (!serve) return hint(readOnly, 4000), true

  /** Each picture saved into the folder's images/, with its size to place it at (no wider than 1200). */

        const body = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(body.error || `Saving the picture failed (${res.status})`)

        const k = Math.min(1, 1200 / Math.max(1, size.w))
        saved.push({ src: body.src, w: Math.max(1, Math.round(size.w * k)), h: Math.max(1, Math.round(size.h * k)) })

  async function pasteNote(text, at) {

  /** Figma's Tab on the canvas: the next object on the page is picked (Shift+Tab the one before), in reading order

    if (!list.length) return
    const at = list.findIndex((i) => i.id === picked)
    const to = list[(at + d + list.length) % list.length]
    pickItem(to.id)
    const g = geometryOf(to)
    const a = toScreen(g.x, g.y)
    const b = toScreen(g.x + (g.w ?? 0), g.y + (g.h ?? 0))

  const colorOf = (i) => String(i.color || (i.kind === 'note' ? NOTE_COLORS[0] : '')).toLowerCase()
  function matching() {

    const like = new Set(ids.map((id) => board.items.find((i) => i.id === id)).filter(Boolean).map((i) => `${i.kind} ${colorOf(i)}`))
    return items().filter((i) => i.kind !== 'guide' && (like.has(`${i.kind} ${colorOf(i)}`) && (!isLocked(i.id) || ids.includes(i.id)))).map((i) => i.id)

  /** The menu of the board objects selected: what their keys and bar do, in one place. */

      { label: 'Copy', key: 'Ctrl+C', run: copyItems },
      boardClip ? { label: 'Paste', key: 'Ctrl+V', run: pasteItems } : null,
      boardClip ? { label: 'Paste in place', key: 'Ctrl+Shift+V', run: pasteInPlace } : null,
      { label: 'Duplicate', key: 'Ctrl+D', run: duplicateItems },
      free ? '-' : null,

      free ? { label: 'Send to back', key: 'Ctrl+Shift+[', run: () => restack(false) } : null,

      '-',

      // side, joined by an arrow.

        if (kind === 'artboard') {
          if (!moved || w < 40) {
            ;[, w, hgt] = artboardSize()
          }
          setTool('select')
          return newArtboard(x, y, w, hgt)
        }
        let item
        if (kind === 'pencil' || kind === 'line' || kind === 'arrow') {
          const all = kind === 'pencil' ? pts : [p.x, p.y, last.x, last.y]
          if (!moved && from?.side) return quickMake(from.from, from.side)
          if (!moved || all.length < 4) return
          const xs = all.filter((_, i) => i % 2 === 0)
          const ys = all.filter((_, i) => i % 2 === 1)
          x = Math.min(...xs)
          y = Math.min(...ys)
          w = Math.max(...xs) - x
          hgt = Math.max(...ys) - y
          item = { kind, x, y, w, h: hgt, points: all.map((v, i) => Math.round(v - (i % 2 ? y : x))), ...(kind === 'pencil' ? { weight: penNow()[2], color: penColor(), ...(penNow()[3] ? { pen: penNow()[3] } : {}) } : {}) }
          // A line or arrow begun or ended on an object or a frame holds on to it.
          if (kind !== 'pencil') {
            const start = from?.from ?? bindAt(p)
            let to = bindAt(last)
            if (start) item.from = start
            // Drawn from a connector dot and let go on empty board: a new one like the first, there, held at that end.
            if (from && (!to || to === start)) {
              const src = board.items.find((i) => i.id === from.from)
              if (src) {
                const made = await addItem({ kind: src.kind, x: Math.round(last.x - src.w / 2), y: Math.round(last.y - src.h / 2), w: src.w, h: src.h, text: '', ...(src.color ? { color: src.color } : {}) })

              }
            }

          }
        } else {

            hgt = kind === 'note' ? 260 : kind === 'section' ? 1000 : 300

            y = p.y
          }
          item = { kind, x, y, w, h: hgt, ...(kind === 'note' ? { text: '', color: NOTE_COLORS[0] } : kind === 'section' ? { text: 'Section' } : {}) }
        }
        const id = await addItem(item)
        if (kind !== 'pencil') setTool('select')

        if (from?.made) {

          pickItem(from.made)
          return editItemText(from.made)
        }

  }
  /** FigJam's quick create: a new note or shape like this one, a gap away on the side whose dot was clicked, with an
   *  arrow from this one to it, picked to type in. Where that spot is taken it moves along until it is free. */
  async function quickMake(srcId, side) {
    const src = board.items.find((i) => i.id === srcId)
    if (!src) return
    const [dx, dy] = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] }[side]
    const gap = 120
    let x = src.x + dx * (src.w + gap)
    let y = src.y + dy * (src.h + gap)
    const solid = (i) => i.id !== src.id && !['line', 'arrow', 'pencil', 'section', 'guide'].includes(i.kind)
    const taken = () => items().some((i) => solid(i) && x < i.x + (i.w ?? 0) && x + src.w > i.x && y < i.y + (i.h ?? 0) && y + src.h > i.y)
    for (let k = 0; k < 20 && taken(); k++) {
      if (dx) y += src.h + 40
      else x += src.w + 40
    }
    x = Math.round(x)
    y = Math.round(y)
    const made = await addItem({ kind: src.kind, x, y, w: src.w, h: src.h, text: '', ...(src.color ? { color: src.color } : {}) })
    if (!made) return
    const a = [src.x + src.w / 2 + (dx * src.w) / 2, src.y + src.h / 2 + (dy * src.h) / 2]
    const b = [x + src.w / 2 - (dx * src.w) / 2, y + src.h / 2 - (dy * src.h) / 2]
    const ax = Math.round(Math.min(a[0], b[0]))
    const ay = Math.round(Math.min(a[1], b[1]))
    await addItem({ kind: 'arrow', x: ax, y: ay, w: Math.round(Math.abs(b[0] - a[0])), h: Math.round(Math.abs(b[1] - a[1])), points: [a[0] - ax, a[1] - ay, b[0] - ax, b[1] - ay].map(Math.round), from: src.id, to: made })
    setTool('select')
    renderItems()
    pickItem(made)
    editItemText(made)
  }
  async function newArtboard(x, y, w, hgt) {
    if (data.memory) return hint(NO_FILES, 4000)
    const name = await question('Name the new prototype file. It is made in the canvas folder.', 'untitled')
    if (!name) return
    try {
      const res = await fetch('/api/artboard', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, x, y, w, h: hgt, page: pageId, by: me || 'someone' }) })
      const body = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(body.error || `Making it failed (${res.status})`)

      if (body.event) {

    } catch (err) {
      hint(err.message, 4000)

  // ── locks ──
  // A locked frame or board object is not moved, changed or removed by anyone until it is
  // unlocked, and a visitor puts nothing new over it. Only the owner locks and unlocks: whoever
  // edits the canvas where it lives (served by node, or its folder on disk), never a visitor to a
  // published copy.
  const LOCKED = 'That is locked'
  const isLocked = (key) => !!key && (board.locked ?? []).includes(key)
  const owner = () => serve && !visitor
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h
  /** The locked frames and objects on this page a box would sit over, leaving out `self`. */
  function coversLocked(box, self) {
    const lockedFrames = frames().filter((f) => f.key !== self && isLocked(f.key)).map((f) => ({ x: f.x, y: f.y, w: f.W, h: f.H }))
    const lockedItems = items().filter((i) => i.id !== self && isLocked(i.id) && !['line', 'arrow', 'guide'].includes(i.kind)).map(geometryOf)

  /** Why a board change may not be made, or null. */
  function lockedReason(input) {
    if (input.op === 'lock') return owner() ? null : 'Only the owner can lock and unlock things.'
    if ((input.op === 'item' || input.op === 'remove') && isLocked(input.id)) return LOCKED
    if (input.op === 'move' && isLocked(input.key)) return LOCKED
    if (owner()) return null
    if (input.op === 'page' && input.removed) {
      const held = [...allFrames.values()].some((f) => f.page === input.id && isLocked(f.key)) || board.items.some((i) => (i.page ?? firstPage()) === input.id && isLocked(i.id))

    let box = null
    if (input.op === 'move') {
      const f = allFrames.get(input.key)
      if (f) box = { x: input.x, y: input.y, w: f.W, h: f.H }
    } else if (input.op === 'item') {
      const it = { ...(board.items.find((i) => i.id === input.id) ?? {}), ...input }
      if (!['line', 'arrow', 'guide'].includes(it.kind) && it.x != null) box = { x: it.x, y: it.y, w: it.w ?? 200, h: it.h ?? 60 }

  /** After a change was refused: draw the board as its lines say again. */

  async function setLock(keys, locked) {

    drawLocks()
    placeItemBar()
  }
  /** Each frame's lock in its header: a padlock when locked; for the owner, the button that toggles it. */
  function drawLock(f) {

  // Changes drawn before their lines are saved, by 'item:<id>' or 'frame:<key>': each board read from the lines again
  // (as every saved line does) takes them back on until their own line is saved.
  const ahead = new Map()
  function drawAhead() {
    for (const [k, fields] of ahead) {

  }
  /** Every line of one action: all of it drawn at once, then saved in order, so what is drawn never steps back while

  async function sendAll(inputs) {
    for (const input of inputs) {

      else if (input.op === 'item' && input.id) {
        const { op, id, name, ...fields } = input
        ahead.set(`item:${id}`, { ...(ahead.get(`item:${id}`) ?? {}), ...fields })
      } else if (input.op === 'move') {
        const { op, key, name, ...fields } = input

  async function sendBoard(input) {

  }

  // ── find and replace: the page's artboards' text and its board objects' text ──
  const findBar = h('div', { id: 'findbar', role: 'search', 'aria-label': 'Find and replace' })
  document.body.append(findBar)
  let found = []
  let foundAt = -1
  const findIn = h('input', { type: 'search', placeholder: 'Find', 'aria-label': 'Find', spellcheck: 'false' })
  const replaceIn = h('input', { type: 'text', placeholder: 'Replace with', 'aria-label': 'Replace with', spellcheck: 'false' })
  const findCount = h('span', { class: 'find-n', 'aria-live': 'polite' })

    // Clicked, it leaves the typing where it was, so Enter goes on stepping through what is found.

  /** What a search looks for: the words as typed, any case unless Match case, inside other words unless Whole words. */

  findBar.append(
    findIn, findCount, optButton('matchCase', 'Aa', 'Match case'), optButton('wholeWord', 'ab|', 'Whole words'), optButton('allPages', 'All pages', 'Search every page, not only this one'),
    h('button', { type: 'button', class: 'tool', title: 'Previous (Shift+Enter)', 'aria-label': 'Previous', onclick: () => stepFound(-1) }, '↑'),
    h('button', { type: 'button', class: 'tool', title: 'Next (Enter)', 'aria-label': 'Next', onclick: () => stepFound(1) }, '↓'),
    h('span', { class: 'sep' }),
    replaceIn,
    h('button', { type: 'button', class: 'tool', title: 'Replace every match on this page', onclick: () => replaceAll() }, 'Replace all'),
    h('button', { type: 'button', class: 'tool', title: 'Close (Escape)', 'aria-label': 'Close', onclick: () => closeFind() }, '✕'),
  )
  /** Every artboard on the page is loaded, so all of its text can be searched. */
  async function loadPage() {
    for (const f of frames()) if (!f.loaded && f.el) { f.loaded = true; loadFrame(f) }
    for (let i = 0; i < 50 && frames().some((f) => f.el && !f.doc); i++) await new Promise((r) => setTimeout(r, 100))
  }
  async function runFind() {
    const q = findIn.value.trim()
    const re = q ? findRe(q) : null
    found = []
    foundAt = -1
    if (q) {
      await loadPage()
      for (const f of frames()) {
        if (!f.doc?.body) continue
        const walk = f.doc.createTreeWalker(f.doc.body, NodeFilter.SHOW_TEXT, { acceptNode: (t) => (t.parentElement?.closest('script, style, template, noscript') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) })

        const body = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(body.error || `Replacing failed (${res.status})`)
        if (!body.same) {
          n += body.count ?? 0

  }

  }

    findIn.select()

  }

    findBar.classList.remove('open')
    found = []
  }

  // ── undo and redo for the board ──
  // One history with the prototypes' edits, as in Figma: Ctrl+Z undoes whatever was done last.
  // A step is everything one action sent (a group dragged, an align, a paste): each board object
  // and frame it touched, as it was before and after. A file edit is a 'file' entry, undone by the server.
  const history = []
  const future = []
  let openStep = null
  let replaying = false
  const ITEM_KEYS = ['kind', 'page', 'x', 'y', 'w', 'h', 'z', 'text', 'color', 'frame', 'from', 'to', 'group', 'cols', 'gutter', 'margin', 'points', 'size', 'src', 'route', 'dx', 'dy', 'weight', 'pen', 'ends', 'dash', 'fill', 'author', 'vote']
  /** A board object's words with each web address in them a link, as FigJam's: Ctrl or Cmd + click opens it (a plain
      click picks the object, as anywhere on it), and where nothing can be edited a plain click opens it. */
  function linked(text) {
    const parts = String(text ?? '').split(/(https?:\/\/[^\s<>"]+)/)
    return parts.map((t, i) => {
      if (i % 2 === 0) return t
      const tail = /[.,;:!?)\]]+$/.exec(t)?.[0] ?? ''
      const href = tail ? t.slice(0, -tail.length) : t
      return [h('a', { class: 'board-link', href, target: '_blank', rel: 'noopener', title: serve ? `${href} (Ctrl+click to open)` : href }, href), tail]
    }).flat().filter((x) => x !== '')
  }
  viewport.addEventListener('click', (e) => {
    const a = e.target.closest?.('a.board-link')

  /** The one thing a line touches, as a board says it is: an object's fields, a frame's place, or null for nothing there. */
  function stateOf(b, ev) {

      if (!ev.id) return { id: null, state: null }
      const it = b.items.find((i) => i.id === ev.id)
      return { id: ev.id, state: it ? Object.fromEntries(ITEM_KEYS.filter((k) => it[k] != null).map((k) => [k, it[k]])) : null }
    }
    if (ev.op === 'move') {
      const f = allFrames.get(ev.key)
      const m = b.moved[ev.key] ?? f?.home
      return { key: ev.key, state: m ? { x: m.x, y: m.y, page: m.page ?? f?.page ?? null, group: m.group ?? '' } : null }

    if (ev.op === 'page') {

  async function send(input) {

  }

      // and the caret out of a reply being typed.
      if (Array.isArray(body.events) && body.events.length >= events.length && JSON.stringify(body.events) !== JSON.stringify(events)) {

        const event = makeBoardEvent(body.event)
        const held = locks()
        if (play && event.op === 'lock') return answer(403, { error: 'Only the owner can lock and unlock things.' })
        if (held.includes(event.op === 'move' ? event.key : event.id) && ['item', 'remove', 'move'].includes(event.op)) return answer(403, { error: 'That is locked' })
        lines.push(lineOf(event, 'board'))
        await writeCanvas()
        return answer(200, { event })
      }
      case '/api/file': {
        const file = u.searchParams.get('f')
        if (!known(file)) return answer(404, { error: `${file} is not on this canvas` })
        return answer(200, { html: await served(file) })
      }
      case '/api/source': {
        const file = u.searchParams.get('f')
        if (!known(file)) return answer(404, { error: `${file} is not on this canvas` })
        const src = raw.get(file)
        const el = canvasHtml.parse(src).byStart.get(Number(u.searchParams.get('cv')))
        return answer(200, { html: el ? src.slice(el.start, el.end) : null })
      }
      case '/api/edit': {
        const { file, edit, name } = body
        if (!known(file)) return answer(404, { error: `${file} is not on this canvas` })
        const before = raw.get(file)
        if (locks().some((k) => k === file || k.startsWith(`${file}#`))) return answer(403, { error: 'This artboard is locked' })
        const refused = canvasHtml.lockedFor(before, edit, { owner: !play })
        if (refused) return answer(403, { error: refused })
        const result = canvasHtml.applyEdit(before, edit)
        if (result.src === before) return answer(200, { select: result.select, html: await served(file), same: true })
        raw.set(file, result.src)
        await write(file, result.src)
        undo.push({ file, before, after: result.src })
        // The last 200 steps, as the server keeps: each holds the whole file twice.
        if (undo.length > 200) undo.splice(0, undo.length - 200)
        redo.length = 0
        lines.push(lineOf({ op: edit.op, id: randomId('e'), at: new Date().toISOString(), name: nameOf(name), file, summary: summarize(before, edit).slice(0, 600), sha: await sha(result.src) }, 'edit'))
        await writeCanvas([file])
        return answer(200, { select: result.select, linked: result.linked ?? 0, count: result.count, html: await served(file) })
      }
      case '/api/undo':
      case '/api/redo': {
        const back = u.pathname.endsWith('/undo')
        const step = (back ? undo : redo).pop()
        if (!step) return answer(200, { none: true })
        const now = play ? raw.get(step.file) : await readText(step.file)
        if (now !== (back ? step.after : step.before)) {
          ;(back ? undo : redo).push(step)
          return answer(409, { error: `${step.file} has changed somewhere else since then, so nothing was undone.` })
        }
        const want = back ? step.before : step.after
        raw.set(step.file, want)
        await write(step.file, want)
        ;(back ? redo : undo).push(step)
        lines.push(lineOf({ op: back ? 'undo' : 'redo', id: randomId('e'), at: new Date().toISOString(), name: nameOf(body.name), file: step.file, summary: back ? 'undid the last edit' : 'redid an edit', sha: await sha(want) }, 'edit'))
        await writeCanvas([step.file])
        return answer(200, { file: step.file, html: await served(step.file) })
      }
      case '/api/selection':
        if (post) {
          selection = body.selection ?? null
          return answer(200, { ok: true })
        }
        return answer(200, { selection })
      case '/api/agent':
        return answer(200, { threads: foldEvents(parseEvents(lines.join('\n'))).filter((t) => t.agent && !t.resolved) })
      case '/api/history':
        return answer(200, { edits: parseLines(lines.join('\n'), 'edit') })
      case '/api/canvas':
        return new Response(canvasText, { headers: { 'content-type': 'text/html' } })
      case '/api/refresh':
        return answer(409, { error: 'Rebuilding lays the prototypes out again, which needs node. Run node scripts/canvas.mjs build <folder>.' })
      case '/api/image': {
        // A picture dropped or pasted, saved into the folder's images/, as the server does: known kinds by their
        // bytes, the same picture again the file already there, another of the same name numbered.
        if (play) return answer(409, { error: 'A picture is saved into the folder, so this needs the folder. Download the canvas and open it with Edit here.' })
        const bytes = new Uint8Array(await init.body.arrayBuffer())
        if (bytes.length > 15_000_000) return answer(413, { error: 'the picture is larger than 15 MB' })
        const str = (a, b) => String.fromCharCode(...bytes.subarray(a, b))
        const starts = (...b) => b.every((v, i) => bytes[i] === v)
        const ext = starts(0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a) ? 'png' : starts(0xff, 0xd8, 0xff) ? 'jpg' : str(0, 4) === 'GIF8' ? 'gif' : str(0, 4) === 'RIFF' && str(8, 12) === 'WEBP' ? 'webp' : str(4, 8) === 'ftyp' && /avi[fs]/.test(str(8, 12)) ? 'avif' : null
        if (!ext) return answer(415, { error: 'a PNG, JPEG, GIF, WebP or AVIF picture' })
        const base = (u.searchParams.get('name') || 'image').replace(/\.[^.]*$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'image'
        for (let n = 1; ; n++) {
          const src = `images/${base}${n > 1 ? `-${n}` : ''}.${ext}`
          let have = null
          try {
            have = new Uint8Array(await (await (await fileHandle(src)).getFile()).arrayBuffer())
          } catch {}
          if (!have) {
            await write(src, bytes)
            return answer(200, { src, saved: true })
          }
          if (have.length === bytes.length && have.every((v, i) => v === bytes[i])) return answer(200, { src, saved: false })
        }
      }
      case '/api/artboard': {
        // Copies of prototypes on the board (Ctrl+D on screens): each file copied whole to <name>-copy.html.
        if (Array.isArray(body.copies)) {
          const files = []
          const events = []
          for (const c of body.copies.slice(0, 20)) {
            const from = String(c?.from ?? '')
            if (!known(from)) return answer(404, { error: `${from} is not on this canvas` })
            const base = from.replace(/\.html$/, '').replace(/^.*\//, '').replace(/[^A-Za-z0-9-]+/g, '-').slice(0, 54)
            const dir = from.includes('/') ? from.slice(0, from.lastIndexOf('/') + 1) : ''
            const taken = async (f) => {
              if (raw.has(f)) return true
              if (play) return false
              try {
                await fileHandle(f)
                return true
              } catch {
                return false
              }
            }
            let file = `${dir}${base}-copy.html`
            for (let n = 2; await taken(file); n++) file = `${dir}${base}-copy-${n}.html`
            const html = raw.get(from)
            raw.set(file, html)
            await write(file, html)
            data.files[file] = await served(file)
            data.meta[file] = { ...(data.meta[from] ?? { levers: [], fluid: false, play: false }) }
            ;(data.loose ??= []).push({ file, hash: '', label: file.replace(/\.html$/, ''), w: Math.round(Number(c.w) || 1440), h: Math.round(Number(c.h) || 900) })
            const event = makeBoardEvent({ op: 'move', key: file, x: Number(c.x) || 0, y: Number(c.y) || 0, page: body.page, name: body.by })
            lines.push(lineOf(event, 'board'))
            files.push(file)
            events.push(event)
          }
          await writeCanvas(files)
          return answer(200, { files, events })
        }
        const base = String(body.name ?? '').trim().toLowerCase().replace(/\.html$/, '').replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60)
        if (!base) return answer(400, { error: 'the artboard needs a name' })
        const file = `${base}.html`
        if (/^canvas(-[a-z0-9-]+)?\.html$/.test(file)) return answer(400, { error: `${file} is the name of a canvas` })
        if (raw.has(file)) return answer(409, { error: `${file} is already on this canvas` })
        if (!play) {
          try {
            await fileHandle(file)
            return answer(409, { error: `${file} is already in the folder` })
          } catch {}
        }
        const w = Math.max(240, Math.min(3840, Math.round(Number(body.w) || 1440)))
        const title = String(body.name).trim().slice(0, 120).replace(/</g, '&lt;')
        const html = `<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${title}</title>\n${w === 1440 ? '' : `<meta name="canvas-width" content="${w}">\n`}<style>\n  body { margin: 0; font-family: system-ui, sans-serif; }\n</style>\n</head>\n<body>\n<main style="min-height: ${Math.max(240, Math.round(Number(body.h) || 900))}px">\n</main>\n</body>\n</html>\n`
        raw.set(file, html)
        await write(file, html)
        data.files[file] = await served(file)
        data.meta[file] = { levers: [], fluid: false, play: false }
        ;(data.loose ??= []).push({ file, hash: '', label: base, w, h: Math.max(480, Math.round(Number(body.h) || 900)) })
        const event = makeBoardEvent({ op: 'move', key: file, x: Number(body.x) || 0, y: Number(body.y) || 0, page: body.page, name: body.by })
        lines.push(lineOf(event, 'board'))
        await writeCanvas([file])
        return answer(200, { file, event })
      }
      default:
        return answer(404, { error: 'not found' })
    }
  }
  const realFetch = window.fetch.bind(window)
  let on = false
  window.fetch = (input, init) => {
    const url = typeof input === 'string' ? input : input.url
    if (on && /^(\/|\.\/|[^:]*\/)?api\//.test(url.replace(location.origin, ''))) {
      return handle(url, init).catch((err) => answer(400, { error: err.message }))
    }
    return realFetch(input, init)
  }

  /** Edit with the folder given: read every prototype and the canvas, then answer /api/ from them. */
  async function useFolder(handle) {
    dir = handle
    canvasName = decodeURIComponent(location.pathname.split('/').pop() || '') || 'canvas.html'
    if (!/\.html$/i.test(canvasName)) canvasName = 'canvas.html'
    try {
      canvasText = await readText(canvasName)
    } catch {
      throw new Error(`There's no ${canvasName} in that folder. Pick the folder this canvas is in.`)
    }
    for (const file of Object.keys(data.files)) {
      try {
        raw.set(file, await readText(file))
        seen.set(file, (await (await fileHandle(file)).getFile()).lastModified)
      } catch {
        throw new Error(`${file} isn't in that folder. Pick the folder this canvas is in.`)
      }
    }
    lines = storedLines(canvasText)
    for (const file of raw.keys()) data.files[file] = await served(file)
    on = true
    dc.enableLocal(dir.name || "this folder")
    // A change made outside the canvas (an agent, a build script) redraws its frames.
    setInterval(async () => {
      if (document.visibilityState !== 'visible') return
      for (const file of raw.keys()) {
        try {
          const f = await (await fileHandle(file)).getFile()
          if (f.lastModified === seen.get(file)) continue
          seen.set(file, f.lastModified)
          const text = await f.text()
          if (text === raw.get(file)) continue
          raw.set(file, text)
          dc.fileChanged(file)
        } catch {}
      }
    }, 2000)
  }
  /** Edit from the page itself, as a visitor to the site it is on: nothing to pick, kept in this browser. */
  async function usePage() {
    canvasName = decodeURIComponent(location.pathname.split('/').pop() || '') || 'index.html'
    try {
      canvasText = await (await realFetch(location.pathname, { cache: 'no-store' })).text()
    } catch {
      canvasText = `<!doctype html>\n${document.documentElement.outerHTML}`
    }
    for (const file of Object.keys(data.files)) {
      raw.set(file, data.files[file])
      builtFiles.add(file)
    }
    lines = storedLines(document.documentElement.outerHTML)
    builtLines = lines.length
    const before = kept()
    if (before) {
      for (const l of before.loose ?? []) {
        if (builtFiles.has(l.file) || typeof before.files?.[l.file] !== 'string') continue
        ;(data.loose ??= []).push(l)
        data.meta[l.file] = before.meta?.[l.file] ?? { levers: [], fluid: false, play: false }
      }
      for (const [file, text] of Object.entries(before.files ?? {})) {
        if (typeof text !== 'string') continue
        raw.set(file, text)
        edited.add(file)
      }
      for (const l of before.lines ?? []) if (typeof l === 'string') lines.push(l)
    }
    for (const file of raw.keys()) data.files[file] = canvasHtml.tag(raw.get(file))
    on = true
    dc.enableLocal('here', 'Edit, draw and comment: everything is kept in this browser, for you alone', true)
    dc.refreshBoard()
  }
  if (play) {
    // A visitor takes back everything they changed: the canvas as it was published.
    dc.startOver = async () => {
      if (!(await dc.sure('Drop every change you made here and see the canvas as it was published?', 'Start over', true))) return
      try { localStorage.removeItem(keepKey) } catch {}
      location.reload()
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(usePage))
    else setTimeout(usePage)
    return
  }

  async function start() {
    try {
      let handle = await recall()
      if (handle && (await handle.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await handle.requestPermission({ mode: 'readwrite' })) !== 'granted') handle = null
      if (!handle) handle = await window.showDirectoryPicker({ id: 'design-canvas', mode: 'readwrite', startIn: 'desktop' })
      await useFolder(handle)
      await remember(handle)
      dc.hint(`Editing ${handle.name}. Changes are saved into its files.`, 2600)
    } catch (err) {
      if (err?.name !== 'AbortError') dc.hint(err.message, 5000)
    }
  }

  // The mode chip becomes the Edit button.
  const button = document.createElement('button')
  button.type = 'button'
  button.id = 'canvas-mode'
  button.className = 'mode edit'
  button.textContent = supported ? 'Viewing · Edit' : 'Viewing'
  button.title = supported ? 'Edit and comment here: pick the folder this canvas is in, once' : 'Editing from disk needs Chrome or Edge; anywhere else, serve it with node scripts/canvas.mjs serve <folder>'
  button.disabled = !supported
  button.addEventListener('click', () => !on && start())
  mode.replaceWith(button)
  dc.showEmpty?.()
  dc.useFolder = useFolder
  if (supported) dc.startLocal = () => !on && start()

  // A browser that cannot save says so up front, once per visit, and can be closed.
  if (!supported) {
    const banner = document.createElement('div')
    banner.id = 'banner'
    banner.setAttribute('role', 'status')
    const text = document.createElement('span')
    text.textContent = 'This browser can only view this canvas: it cannot save edits or comments to your files. Open canvas.html in Chrome or Edge to edit.'
    const close = document.createElement('button')
    close.type = 'button'
    close.className = 'tool'
    close.title = 'Close'
    close.setAttribute('aria-label', 'Close')
    close.textContent = '✕'
    close.addEventListener('click', () => {
      banner.remove()
      document.body.classList.remove('has-banner')
    })
    banner.append(text, close)
    document.body.append(banner)
    document.body.classList.add('has-banner')
  }
})()
